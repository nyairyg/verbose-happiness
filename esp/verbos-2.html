<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Actividad</title>
    <style>
        :root {
            --bg: #EDE9E2;
            --surface: #FFFFFF;
            --text: #1a1a1a;
            --text-secondary: #6b6560;
            --border: #d4cfc7;
            --border-strong: #3a3a3a;
            --gap-underline: #5c5750;
            --selected-bg: #1a1a1a;
            --selected-text: #ffffff;
            --correct-bg: #e8f0e9;
            --correct-border: #3d7a4a;
            --correct-text: #2d5a35;
            --incorrect-bg: #f7e9e9;
            --incorrect-border: #c0392b;
            --incorrect-text: #a83027;
            --word-used-bg: #e8e5df;
            --word-used-text: #b5b0a8;
            --word-used-border: #ddd9d1;
            --word-available-bg: #ffffff;
            --word-available-border: #c4bfb6;
            --word-hover-bg: #f7f5f1;
            --font-stack: 'Helvetica Neue', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            --gap-min-width: 65px;
            --btn-height: 41px;
            --radius: 0px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            -webkit-tap-highlight-color: transparent;
            -webkit-text-size-adjust: 100%;
            background: var(--bg);
        }

        body {
            font-family: var(--font-stack);
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 25px 18px 54px;
            line-height: 1.7;
            letter-spacing: 0.01em;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .container {
            width: 100%;
            max-width: 920px;
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 40px 43px 36px;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.04);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-bottom: 29px;
            padding-bottom: 14px;
            border-bottom: 1px solid var(--border);
        }

        .round-indicator {
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            color: var(--text-secondary);
        }

        .round-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--text);
            letter-spacing: 0.02em;
        }

        .text-block {
            font-size: 17px;
            line-height: 2.2;
            letter-spacing: 0.015em;
            margin-bottom: 36px;
            word-wrap: break-word;
            color: var(--text);
        }

        .gap {
            display: inline-block;
            min-width: var(--gap-min-width);
            text-align: center;
            border-bottom: 2px solid var(--gap-underline);
            padding: 4px 9px 3px;
            margin: 0 3px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: var(--text);
            background: transparent;
            transition: background-color 0.12s ease, border-color 0.12s ease, color 0.12s ease;
            vertical-align: baseline;
            position: relative;
            user-select: none;
            -webkit-user-select: none;
            border-radius: var(--radius);
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .gap:empty::before {
            content: '____________';
            color: #c7c2b9;
            font-weight: 400;
            letter-spacing: 0.04em;
            font-size: 14px;
        }

        .gap.filled {
            color: var(--text);
            border-bottom-color: var(--border-strong);
            background: #fafaf8;
        }

        .gap.selected {
            border-bottom-color: var(--border-strong);
            border-bottom-width: 3px;
            background: #f3f1ec;
            outline: 2px solid var(--border-strong);
            outline-offset: 2px;
        }

        .gap.correct {
            background: var(--correct-bg);
            border-bottom-color: var(--correct-border);
            color: var(--correct-text);
            border-bottom-width: 2px;
            outline: none;
        }

        .gap.incorrect {
            background: var(--incorrect-bg);
            border-bottom-color: var(--incorrect-border);
            color: var(--incorrect-text);
            border-bottom-width: 2px;
            outline: none;
            animation: shake 0.45s ease;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            12% {
                transform: translateX(-5px);
            }
            25% {
                transform: translateX(4px);
            }
            37% {
                transform: translateX(-3px);
            }
            50% {
                transform: translateX(3px);
            }
            62% {
                transform: translateX(-2px);
            }
            75% {
                transform: translateX(2px);
            }
            87% {
                transform: translateX(-1px);
            }
        }

        .word-bank {
            display: flex;
            flex-wrap: wrap;
            gap: 11px;
            margin-bottom: 32px;
            padding: 22px 0;
            border-top: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
            user-select: none;
            -webkit-user-select: none;
        }

        .word-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: var(--btn-height);
            padding: 11px 20px;
            font-size: 14px;
            font-family: var(--font-stack);
            font-weight: 500;
            letter-spacing: 0.02em;
            cursor: pointer;
            border: 1px solid var(--word-available-border);
            background: var(--word-available-bg);
            color: var(--text);
            transition: background-color 0.1s ease, border-color 0.1s ease, color 0.1s ease, opacity 0.1s ease;
            border-radius: var(--radius);
            outline: none;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }

        .word-btn:hover {
            background: var(--word-hover-bg);
            border-color: #a8a39b;
        }

        .word-btn:active {
            background: #e8e4dc;
        }

        .word-btn.used {
            background: var(--word-used-bg);
            color: var(--word-used-text);
            border-color: var(--word-used-border);
            cursor: default;
            pointer-events: none;
            opacity: 0.55;
        }

        .word-btn.selected-word {
            background: var(--selected-bg);
            color: var(--selected-text);
            border-color: var(--selected-bg);
            outline: 2px solid var(--selected-bg);
            outline-offset: 2px;
        }

        .actions {
            display: flex;
            gap: 14px;
            justify-content: flex-end;
            align-items: center;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: var(--btn-height);
            padding: 11px 31px;
            font-size: 13px;
            font-family: var(--font-stack);
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            cursor: pointer;
            border: 1px solid var(--border-strong);
            background: var(--surface);
            color: var(--text);
            transition: background-color 0.1s ease, color 0.1s ease, border-color 0.1s ease;
            border-radius: var(--radius);
            outline: none;
            -webkit-tap-highlight-color: transparent;
            white-space: nowrap;
        }

        .action-btn:hover {
            background: #f5f3ef;
        }
        .action-btn:active {
            background: #e8e4dc;
        }

        .action-btn.primary {
            background: var(--selected-bg);
            color: var(--selected-text);
            border-color: var(--selected-bg);
        }
        .action-btn.primary:hover {
            background: #333;
            border-color: #333;
        }
        .action-btn.primary:active {
            background: #000;
        }

        .action-btn:disabled {
            opacity: 0.35;
            pointer-events: none;
            cursor: default;
        }

        .completion-msg {
            text-align: center;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.02em;
            color: var(--correct-text);
            padding: 11px 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .completion-msg.visible {
            opacity: 1;
        }

        .all-correct-indicator {
            display: inline-block;
            width: 7px;
            height: 7px;
            background: var(--correct-border);
            margin-right: 9px;
            vertical-align: middle;
        }

        @media (max-width: 900px) {
            .container {
                padding: 31px 29px 29px;
                max-width: 100%;
            }
            .text-block {
                font-size: 16px;
                line-height: 2.0;
            }
            .gap {
                min-width: 55px;
                font-size: 14px;
                padding: 3px 7px 2px;
            }
            .gap:empty::before {
                font-size: 13px;
            }
            .word-btn {
                min-height: 38px;
                padding: 9px 14px;
                font-size: 13px;
            }
            .action-btn {
                min-height: 38px;
                padding: 9px 23px;
                font-size: 12px;
            }
            .word-bank {
                gap: 8px;
                padding: 16px 0;
            }
        }

        @media (max-width: 600px) {
            body {
                padding: 14px 7px 36px;
            }
            .container {
                padding: 22px 16px 25px;
            }
            .text-block {
                font-size: 15px;
                line-height: 1.95;
            }
            .gap {
                min-width: 47px;
                font-size: 14px;
                padding: 3px 5px 2px;
            }
            .gap:empty::before {
                font-size: 13px;
                letter-spacing: 0.03em;
            }
            .word-btn {
                min-height: 36px;
                padding: 7px 13px;
                font-size: 13px;
            }
            .action-btn {
                min-height: 38px;
                padding: 7px 18px;
                font-size: 12px;
            }
            .word-bank {
                gap: 6px;
                padding: 13px 0;
            }
            .header {
                margin-bottom: 18px;
                padding-bottom: 11px;
            }
        }

        @media (max-width: 380px) {
            .container {
                padding: 14px 11px 16px;
            }
            .text-block {
                font-size: 14px;
                line-height: 1.85;
            }
            .gap {
                min-width: 40px;
                font-size: 13px;
                padding: 2px 4px 1px;
            }
            .gap:empty::before {
                font-size: 12px;
                letter-spacing: 0.02em;
            }
            .word-btn {
                min-height: 32px;
                padding: 5px 9px;
                font-size: 12px;
            }
            .action-btn {
                min-height: 34px;
                padding: 5px 14px;
                font-size: 11px;
            }
            .word-bank {
                gap: 5px;
                padding: 9px 0;
            }
        }
    </style>
</head>
<body>

                {

                    text: 'Gloria y Paco ____________ colombianos pero ____________ en Nueva York. No ____________ ; ____________ inglés en una escuela de idiomas y ____________ mucho. ____________ una pareja muy simpática. ____________ en Queens en un apartamento pequeño. ____________ vecinos de muchos países. ____________ con ellos en inglés siempre. ____________ a su familia por WhatsApp. ____________ mucho sus comidas típicas. ____________ un restaurante colombiano los fines de semana. ____________ arepas y bandeja paisa. ____________ música de su tierra en casa. ____________ añorar a su país a veces. ____________ muy trabajadores y disciplinados. ____________ todas las mañanas a las seis. ____________ al metro para ir a la escuela. ____________ los profesores de la academia. ____________ muchas ganas de aprender. ____________ mejorar su pronunciación. ____________ la gramática con ejercicios. ____________ películas para practicar el oído. ____________ muy felices con su nueva vida.',
                    words: [

            let currentRound = 0;
            let selectedGapIndex = null;
            let selectedWordIndex = null;
            let gapStates = [];
            let wordBankUsed = [];
            let checkedState = [];
            let allRoundsCompleted = false;
            let currentShuffledWords = [];

            const roundIndicator = document.getElementById('roundIndicator');
            const roundTitle = document.getElementById('roundTitle');
            const textBlock = document.getElementById('textBlock');
            const wordBankEl = document.getElementById('wordBank');
            const checkBtn = document.getElementById('checkBtn');
            const nextBtn = document.getElementById('nextBtn');
            const completionMsg = document.getElementById('completionMsg');

            function shuffleArray(arr) {
                for (let i = arr.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [arr[i], arr[j]] = [arr[j], arr[i]];
                }
                return arr;
            }

            function initRound() {
                const ex = exercises[currentRound];
                const numGaps = ex.answers.length;

                currentShuffledWords = shuffleArray([...ex.words]);

                gapStates = new Array(numGaps).fill(null);
                wordBankUsed = new Array(currentShuffledWords.length).fill(false);
                checkedState = new Array(numGaps).fill(null);
                selectedGapIndex = null;
                selectedWordIndex = null;
                completionMsg.classList.remove('visible');
                completionMsg.textContent = '';

                roundIndicator.textContent = (currentRound + 1) + ' / ' + exercises.length;
                roundTitle.textContent = 'Ejercicio ' + ex.id;

                renderTextBlock(ex);
                renderWordBank();
                updateNextButton();
            }

            function renderTextBlock(ex) {
                const segments = ex.text.split('____________');
                textBlock.innerHTML = '';

                segments.forEach((seg, i) => {
                    if (seg) {
                        const textNode = document.createTextNode(seg);
                        textBlock.appendChild(textNode);
                    }
                    if (i < segments.length - 1) {
                        const gapSpan = document.createElement('span');
                        gapSpan.className = 'gap';
                        gapSpan.dataset.gapIndex = i;
                        if (gapStates[i] !== null) {
                            gapSpan.textContent = gapStates[i].text;
                            gapSpan.classList.add('filled');
                        }
                        if (checkedState[i] === 'correct') {
                            gapSpan.classList.add('correct');
                        } else if (checkedState[i] === 'incorrect') {
                            gapSpan.classList.add('incorrect');
                        }
                        if (selectedGapIndex === i) {
                            gapSpan.classList.add('selected');
                        }
                        gapSpan.addEventListener('click', function(e) {
                            e.preventDefault();
                            handleGapClick(i);
                        });
                        textBlock.appendChild(gapSpan);
                    }
                });
            }

            function renderWordBank() {
                wordBankEl.innerHTML = '';
                currentShuffledWords.forEach((word, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'word-btn';
                    btn.textContent = word;
                    btn.dataset.wordIndex = i;
                    if (wordBankUsed[i]) {
                        btn.classList.add('used');
                    }
                    if (selectedWordIndex === i) {
                        btn.classList.add('selected-word');
                    }
                    btn.addEventListener('click', function(e) {
                        e.preventDefault();
                        handleWordClick(i);
                    });
                    wordBankEl.appendChild(btn);
                });
            }

            function handleGapClick(gapIndex) {
                if (gapStates[gapIndex] !== null && selectedWordIndex === null) {
                    const wbIndex = gapStates[gapIndex].wordBankIndex;
                    wordBankUsed[wbIndex] = false;
                    gapStates[gapIndex] = null;
                    checkedState[gapIndex] = null;
                    selectedGapIndex = gapIndex;
                    selectedWordIndex = null;
                    refreshAll();
                    return;
                }

                if (selectedWordIndex !== null && !wordBankUsed[selectedWordIndex]) {
                    if (gapStates[gapIndex] !== null) {
                        const oldWbIndex = gapStates[gapIndex].wordBankIndex;
                        wordBankUsed[oldWbIndex] = false;
                    }
                    gapStates[gapIndex] = {
                        wordBankIndex: selectedWordIndex,
                        text: currentShuffledWords[selectedWordIndex]
                    };
                    wordBankUsed[selectedWordIndex] = true;
                    checkedState[gapIndex] = null;
                    selectedGapIndex = null;
                    selectedWordIndex = null;
                    refreshAll();
                    return;
                }

                if (selectedWordIndex !== null && wordBankUsed[selectedWordIndex]) {
                    selectedWordIndex = null;
                    selectedGapIndex = gapIndex;
                    refreshAll();
                    return;
                }

                if (selectedGapIndex === gapIndex) {
                    selectedGapIndex = null;
                } else {
                    selectedGapIndex = gapIndex;
                    selectedWordIndex = null;
                }
                refreshAll();
            }

            function handleWordClick(wordIndex) {
                if (wordBankUsed[wordIndex]) {
                    return;
                }

                if (selectedGapIndex !== null) {
                    const gapIndex = selectedGapIndex;
                    if (gapStates[gapIndex] !== null) {
                        const oldWbIndex = gapStates[gapIndex].wordBankIndex;
                        wordBankUsed[oldWbIndex] = false;
                    }
                    gapStates[gapIndex] = {
                        wordBankIndex: wordIndex,
                        text: currentShuffledWords[wordIndex]
                    };
                    wordBankUsed[wordIndex] = true;
                    checkedState[gapIndex] = null;
                    selectedGapIndex = null;
                    selectedWordIndex = null;
                    refreshAll();
                    return;
                }

                if (selectedWordIndex === wordIndex) {
                    selectedWordIndex = null;
                } else {
                    selectedWordIndex = wordIndex;
                    selectedGapIndex = null;
                }
                refreshAll();
            }

            function refreshAll() {
                const ex = exercises[currentRound];
                renderTextBlock(ex);
                renderWordBank();
                updateNextButton();
            }

            function checkAnswers() {
                const ex = exercises[currentRound];
                const numGaps = ex.answers.length;
                let allFilled = true;
                let allCorrect = true;

                for (let i = 0; i < numGaps; i++) {
                    if (gapStates[i] === null) {
                        allFilled = false;
                        allCorrect = false;
                        checkedState[i] = 'incorrect';
                    } else if (gapStates[i].text.trim().toLowerCase() === ex.answers[i].trim().toLowerCase()) {
                        checkedState[i] = 'correct';
                    } else {
                        checkedState[i] = 'incorrect';
                        allCorrect = false;
                    }
                }

                selectedGapIndex = null;
                selectedWordIndex = null;
                refreshAll();

                setTimeout(() => {
                    const gapEls = textBlock.querySelectorAll('.gap.incorrect');
                    gapEls.forEach(el => {
                        el.classList.remove('incorrect');
                        void el.offsetWidth;
                        el.classList.add('incorrect');
                    });
                }, 30);

                if (allFilled && allCorrect) {
                    completionMsg.innerHTML =
                        '<span class="all-correct-indicator"></span>Completado';
                    completionMsg.classList.add('visible');
                } else {
                    completionMsg.classList.remove('visible');
                    completionMsg.textContent = '';
                }

                updateNextButton();
            }

            function updateNextButton() {
                const ex = exercises[currentRound];
                const allFilled = gapStates.every(g => g !== null);
                const allCorrect = gapStates.every((g, i) =>
                    g !== null && g.text.trim().toLowerCase() === ex.answers[i].trim().toLowerCase()
                );

                if (currentRound >= exercises.length - 1 && allFilled && allCorrect && allRoundsCompleted) {
                    nextBtn.textContent = 'Finalizado';
                    nextBtn.disabled = true;
                    nextBtn.style.opacity = '0.5';
                } else if (currentRound >= exercises.length - 1 && allFilled && allCorrect) {
                    nextBtn.textContent = 'Finalizar';
                    nextBtn.disabled = false;
                    nextBtn.style.opacity = '1';
                } else {
                    nextBtn.textContent = 'Siguiente';
                    nextBtn.disabled = false;
                    nextBtn.style.opacity = '1';
                }
            }

            function goToNextRound() {
                const ex = exercises[currentRound];
                const allFilled = gapStates.every(g => g !== null);
                const allCorrect = gapStates.every((g, i) =>
                    g !== null && g.text.trim().toLowerCase() === ex.answers[i].trim().toLowerCase()
                );

                if (!allFilled || !allCorrect) {
                    if (!allFilled || gapStates.some((g, i) =>
                            g === null || g.text.trim().toLowerCase() !== ex.answers[i].trim().toLowerCase()
                        )) {
                        checkAnswers();
                        const stillAllCorrect = gapStates.every((g, i) =>
                            g !== null && g.text.trim().toLowerCase() === ex.answers[i].trim().toLowerCase()
                        );
                        if (!stillAllCorrect) {
                            return;
                        }
                    }
                }

                if (currentRound < exercises.length - 1) {
                    currentRound++;
                    initRound();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    allRoundsCompleted = true;
                    completionMsg.innerHTML =
                        '<span class="all-correct-indicator"></span>Todos los ejercicios completados';
                    completionMsg.classList.add('visible');
                    nextBtn.textContent = 'Finalizado';
                    nextBtn.disabled = true;
                    nextBtn.style.opacity = '0.5';
                    updateNextButton();
                }
            }

            checkBtn.addEventListener('click', function(e) {
                e.preventDefault();
                checkAnswers();
            });

            nextBtn.addEventListener('click', function(e) {
                e.preventDefault();
                goToNextRound();
            });

            initRound();

            document.addEventListener('touchstart', function(e) {
                if (e.target.tagName === 'BUTTON' || e.target.classList.contains('gap')) {
                    e.preventDefault();
                    e.target.click();
                }
            }, { passive: false });

        })();
    </script>
</body>
</html>
