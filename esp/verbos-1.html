<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>Conjugar en español — verbos clásicos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-color: #FBFBFA;
      font-family: 'Bitter', 'Georgia', 'Times New Roman', serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      -webkit-tap-highlight-color: transparent;
    }

    .quiz-container {
      max-width: 720px;
      width: 100%;
      background: transparent;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
    }

    .progress-section {
      width: 100%;
      display: flex;
      justify-content: flex-end;
      font-size: 1.1rem;
      font-weight: 500;
      color: #6B6B6B;
    }

    .progress-badge {
      background: #FFFFFF;
      padding: 8px 20px;
      border-radius: 40px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.05);
      border: 1px solid #E9E9E6;
      font-family: 'Bitter', monospace;
      font-weight: 500;
    }

    .verb-buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
      width: 100%;
      margin: 0.2rem 0 0.5rem;
      flex-wrap: wrap;
    }

    .verb-btn {
      font-size: 1.3rem;
      font-weight: 600;
      padding: 0.8rem 1rem;
      min-width: 110px;
      background: #FFFFFF;
      border: 2px solid #E9E9E6;
      border-radius: 48px;
      cursor: pointer;
      color: #2B2B2B;
      transition: all 0.2s ease;
      font-family: 'Bitter', 'Georgia', serif;
      letter-spacing: 0.3px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.02);
      text-transform: none;
      text-align: center;
      line-height: 1.2;
    }

    .verb-btn:hover {
      background: #F5F5F3;
      transform: translateY(-2px);
      border-color: #DCDCD6;
    }

    .verb-btn:active {
      transform: translateY(1px);
    }

    .verb-btn.disabled-btn {
      pointer-events: none;
      opacity: 0.6;
      transform: none;
    }

    .verb-btn.correct-highlight {
      background-color: #C7DDCA !important;
      border-color: #9EBF9E !important;
      transition: background 0.15s;
    }

    .verb-btn.wrong-highlight {
      background-color: #E9C1C1 !important;
      border-color: #D4A0A0 !important;
    }

    .card-flip-container {
      perspective: 1200px;
      width: 100%;
      max-width: 580px;
      margin: 0 auto;
      cursor: pointer;
    }

    .flipper {
      position: relative;
      width: 100%;
      height: auto;
      transition: transform 0.5s cubic-bezier(0.23, 1, 0.32, 1);
      transform-style: preserve-3d;
    }

    .flipped .flipper {
      transform: rotateY(180deg);
    }

    .front-card, .back-card {
      background: #FFFFFF;
      width: 100%;
      padding: 2.2rem 1.5rem;
      text-align: center;
      border-radius: 32px;
      box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.08);
      border: 1px solid #E9E9E6;
      backface-visibility: hidden;
    }

    .front-card {
      transform: rotateY(0deg);
    }

    .back-card {
      position: absolute;
      top: 0;
      left: 0;
      transform: rotateY(180deg);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100%;
    }

    .sentence-display {
      font-size: 1.8rem;
      font-weight: 500;
      color: #2B2B2B;
      word-break: break-word;
      font-family: 'Bitter', 'Georgia', serif;
      line-height: 1.4;
    }

    .blank-highlight {
      display: inline-block;
      background: #F2F0E6;
      padding: 0 6px;
      border-radius: 16px;
      font-weight: 700;
      color: #A56B2F;
      text-decoration: underline;
      text-decoration-style: dotted;
      transition: all 0.2s;
    }
    
    .filled-word {
      background: #C7DDCA;
      color: #2B5E2B;
      text-decoration: none;
      font-weight: 700;
      padding: 0 8px;
      border-radius: 20px;
    }

    .translation-display {
      font-size: 1.6rem;
      font-weight: 500;
      color: #2B2B2B;
      margin-top: 0.5rem;
      font-family: 'Bitter', serif;
    }

    .translation-label {
      font-size: 0.85rem;
      color: #6B6B6B;
      margin-bottom: 0.8rem;
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .correct-card .front-card {
      background-color: #C7DDCA;
    }

    .wrong-card .front-card {
      background-color: #E9C1C1;
    }

    .action-bar {
      display: flex;
      justify-content: center;
      gap: 1rem;
      margin: 16px 0 4px;
      flex-wrap: wrap;
    }

    .translation-btn, .next-btn {
      background: #F5F5F3;
      border: 1px solid #E9E9E6;
      padding: 8px 24px;
      font-size: 1rem;
      font-weight: 500;
      border-radius: 60px;
      cursor: pointer;
      color: #2B2B2B;
      transition: all 0.2s;
      font-family: 'Bitter', serif;
    }

    .translation-btn:hover, .next-btn:hover {
      background: #EDE7DE;
      transform: translateY(-1px);
    }
    
    .next-btn {
      background: #E2E6DD;
      border-color: #C8CFBC;
      font-weight: 600;
    }
    
    .next-btn:active {
      transform: translateY(1px);
    }
    
    .next-btn.hidden-next {
      display: none;
    }

    .feedback-msg {
      min-height: 40px;
      font-size: 0.9rem;
      color: #8B8B8B;
      text-align: center;
      margin-top: 8px;
      font-weight: 400;
      font-style: italic;
    }

    .completion-screen {
      background: #FFFFFF;
      border-radius: 32px;
      padding: 2rem 2rem;
      text-align: center;
      border: 1px solid #E9E9E6;
      width: 100%;
    }

    .completion-screen h2 {
      color: #2B2B2B;
      font-size: 1.9rem;
      margin-bottom: 1rem;
    }

    .completion-screen p {
      color: #6B6B6B;
      margin-bottom: 1.8rem;
      font-size: 1.1rem;
    }

    .restart-btn {
      background: #FBFBFA;
      border: 1px solid #E9E9E6;
      padding: 12px 28px;
      font-size: 1.1rem;
      font-weight: 600;
      border-radius: 48px;
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Bitter', serif;
    }

    .restart-btn:hover {
      background: #F5F5F3;
      transform: scale(0.98);
    }

    .hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .verb-btn {
        font-size: 1rem;
        min-width: 90px;
        padding: 0.6rem 0.8rem;
      }
      .sentence-display {
        font-size: 1.4rem;
      }
      .front-card, .back-card {
        padding: 1.8rem 1rem;
      }
      .verb-buttons {
        gap: 0.7rem;
      }
      .action-bar {
        gap: 0.7rem;
      }
    }
  </style>
</head>
<body>
<div class="quiz-container" id="quizRoot">
  <div class="progress-section">
    <div class="progress-badge" id="progressText">0 / 0</div>
  </div>

  <div id="gamePanel">
    <div class="verb-buttons" id="verbOptions">
      <!-- три кнопки с вариантами глаголов -->
    </div>

    <div class="card-flip-container" id="cardFlipContainer">
      <div class="flipper" id="flipper">
        <div class="front-card" id="frontCard">
          <div class="sentence-display" id="sentenceDisplay">cargando...</div>
        </div>
        <div class="back-card" id="backCard">
          <div class="translation-label">🇷🇺 traducción de la frase</div>
          <div class="translation-display" id="translationDisplay">---</div>
        </div>
      </div>
    </div>

    <div class="action-bar">
      <button class="translation-btn" id="showTranslationBtn">📖 mostrar traducción</button>
      <button class="next-btn hidden-next" id="nextQuestionBtn">➡️ Siguiente →</button>
    </div>
    <div class="feedback-msg" id="feedbackMsg"></div>
  </div>

  <div id="completionPanel" class="completion-screen hidden">
    <h2>🎉 ¡Felicidades! 🎉</h2>
    <p>Completaste todas las conjugaciones.<br>¡Muy bien hecho!</p>
    <button class="restart-btn" id="restartCompletionBtn">⟳ Volver a empezar</button>
  </div>
</div>

<script>
  // --------------------------------------------------------------
  // 40 PREGUNTAS (verbos clásicos, presente indicativo)
  // --------------------------------------------------------------
  const QUESTIONS = [
    { sentence: "Yo __________ español en la universidad.", options: ["estudio", "estudias", "estudia"], correct: "estudio", translation: "Я изучаю испанский в университете." },
    { sentence: "Tú __________ mucho café por la mañana.", options: ["bebo", "bebes", "bebe"], correct: "bebes", translation: "Ты пьёшь много кофе по утрам." },
    { sentence: "Mi hermano __________ música clásica.", options: ["gusto", "gustas", "gusta"], correct: "gusta", translation: "Моему брату нравится классическая музыка." },
    { sentence: "Ella __________ en un restaurante italiano.", options: ["trabajo", "trabajas", "trabaja"], correct: "trabaja", translation: "Она работает в итальянском ресторане." },
    { sentence: "¿Dónde __________ tú?", options: ["vivo", "vives", "vive"], correct: "vives", translation: "Где ты живёшь?" },
    { sentence: "Yo __________ en una casa grande.", options: ["vivo", "vives", "vive"], correct: "vivo", translation: "Я живу в большом доме." },
    { sentence: "Tú __________ la ventana por la mañana.", options: ["abro", "abres", "abre"], correct: "abres", translation: "Ты открываешь окно утром." },
    { sentence: "Mi madre __________ la comida para la familia.", options: ["cocino", "cocinas", "cocina"], correct: "cocina", translation: "Моя мама готовит еду для семьи." },
    { sentence: "Él __________ el periódico todos los días.", options: ["leo", "lees", "lee"], correct: "lee", translation: "Он читает газету каждый день." },
    { sentence: "Ella __________ al cine los viernes.", options: ["voy", "vas", "va"], correct: "va", translation: "Она ходит в кино по пятницам." },
    { sentence: "Usted __________ muy bien el español.", options: ["hablo", "hablas", "habla"], correct: "habla", translation: "Вы очень хорошо говорите по-испански." },
    { sentence: "Yo __________ temprano los fines de semana.", options: ["me levanto", "te levantas", "se levanta"], correct: "me levanto", translation: "Я встаю рано по выходным." },
    { sentence: "Tú __________ los dientes después de comer.", options: ["me lavo", "te lavas", "se lava"], correct: "te lavas", translation: "Ты чистишь зубы после еды." },
    { sentence: "Mi hermano __________ la televisión por la noche.", options: ["miro", "miras", "mira"], correct: "mira", translation: "Мой брат смотрит телевизор ночью." },
    { sentence: "La chica __________ música pop en su habitación.", options: ["escucho", "escuchas", "escucha"], correct: "escucha", translation: "Девушка слушает поп-музыку в своей комнате." },
    { sentence: "Yo __________ a mis abuelos los domingos.", options: ["visito", "visitas", "visita"], correct: "visito", translation: "Я навещаю бабушку и дедушку по воскресеньям." },
    { sentence: "Tú __________ rápido en la piscina.", options: ["nado", "nadas", "nada"], correct: "nadas", translation: "Ты быстро плаваешь в бассейне." },
    { sentence: "El profesor __________ la lección con calma.", options: ["explico", "explicas", "explica"], correct: "explica", translation: "Профессор объясняет урок спокойно." },
    { sentence: "Yo __________ un libro interesante ahora.", options: ["leo", "lees", "lee"], correct: "leo", translation: "Я читаю интересную книгу сейчас." },
    { sentence: "Tú __________ mucha agua cuando hace calor.", options: ["bebo", "bebes", "bebe"], correct: "bebes", translation: "Ты пьёшь много воды, когда жарко." },
    { sentence: "Mi padre __________ en una oficina grande.", options: ["trabajo", "trabajas", "trabaja"], correct: "trabaja", translation: "Мой папа работает в большом офисе." },
    { sentence: "Ella __________ a las siete de la mañana.", options: ["me despierto", "te despiertas", "se despierta"], correct: "se despierta", translation: "Она просыпается в семь утра." },
    { sentence: "Yo __________ un poco de francés también.", options: ["conozco", "conoces", "conoce"], correct: "conozco", translation: "Я тоже немного знаю французский." },
    { sentence: "Tú __________ tu teléfono en la mesa.", options: ["pongo", "pones", "pone"], correct: "pones", translation: "Ты кладёшь свой телефон на стол." },
    { sentence: "Mi amigo __________ a las diez de la noche.", options: ["me acuesto", "te acuestas", "se acuesta"], correct: "se acuesta", translation: "Мой друг ложится спать в десять вечера." },
    { sentence: "Yo __________ la guitarra en un grupo.", options: ["toco", "tocas", "toca"], correct: "toco", translation: "Я играю на гитаре в группе." },
    { sentence: "Tú __________ una chaqueta roja hoy.", options: ["llevo", "llevas", "lleva"], correct: "llevas", translation: "Ты сегодня носишь красную куртку." },
    { sentence: "El perro __________ en el jardín.", options: ["corro", "corres", "corre"], correct: "corre", translation: "Собака бегает в саду." },
    { sentence: "Yo __________ la cena para todos.", options: ["preparo", "preparas", "prepara"], correct: "preparo", translation: "Я готовлю ужин для всех." },
    { sentence: "Tú __________ muchos regalos en tu cumpleaños.", options: ["recibo", "recibes", "recibe"], correct: "recibes", translation: "Ты получаешь много подарков в свой день рождения." },
    { sentence: "Mi hermana __________ en una escuela de música.", options: ["estudio", "estudias", "estudia"], correct: "estudia", translation: "Моя сестра учится в музыкальной школе." },
    { sentence: "Yo __________ un vaso de leche cada mañana.", options: ["tomo", "tomas", "toma"], correct: "tomo", translation: "Я выпиваю стакан молока каждое утро." },
    { sentence: "Tú __________ tus tareas sin problemas.", options: ["hago", "haces", "hace"], correct: "haces", translation: "Ты делаешь свои задания без проблем." },
    { sentence: "El niño __________ jugar al fútbol.", options: ["quiero", "quieres", "quiere"], correct: "quiere", translation: "Ребёнок хочет играть в футбол." },
    { sentence: "Yo __________ el autobús número 42.", options: ["cojo", "coges", "coge"], correct: "cojo", translation: "Я сажусь на автобус номер 42." },
    { sentence: "Tú __________ tu habitación los sábados.", options: ["limpio", "limpias", "limpia"], correct: "limpias", translation: "Ты убираешь свою комнату по субботам." },
    { sentence: "La abuela __________ un pastel delicioso.", options: ["horneo", "horneas", "hornea"], correct: "hornea", translation: "Бабушка печёт вкусный пирог." },
    { sentence: "Yo __________ temprano para hacer ejercicio.", options: ["salgo", "sales", "sale"], correct: "salgo", translation: "Я выхожу рано, чтобы позаниматься." },
    { sentence: "Tú __________ muy bien los números.", options: ["sumo", "sumas", "suma"], correct: "sumas", translation: "Ты очень хорошо складываешь числа." },
    { sentence: "El gato __________ en el sofá todo el día.", options: ["duermo", "duermes", "duerme"], correct: "duerme", translation: "Кот спит на диване целый день." }
  ];

  // --------------------------------------------------------------
  // КЛАСС КВИЗА: вставка слова, переход только по кнопке, без лишних текстов
  // --------------------------------------------------------------
  class ConjugationQuiz {
    constructor(questions, gamePanelEl, completionPanelEl, progressSpan, sentenceDisplay, translationDisplay, feedbackSpan, flipContainer, flipperEl, frontCardEl, backCardEl) {
      this.questions = [...questions];
      this.activeQuestions = [];
      this.currentIndex = 0;
      this.waitingForNext = false;
      this.errorLock = false;
      this.correctAnswerForLock = null;
      this.currentCorrectValue = null;
      this.isAnswerCorrect = false;

      this.gamePanel = gamePanelEl;
      this.completionPanel = completionPanelEl;
      this.progressSpan = progressSpan;
      this.sentenceDisplay = sentenceDisplay;
      this.translationDisplay = translationDisplay;
      this.feedbackSpan = feedbackSpan;
      this.flipContainer = flipContainer;
      this.flipperEl = flipperEl;
      this.frontCardEl = frontCardEl;
      this.backCardEl = backCardEl;
      
      this.buttonsContainer = document.getElementById('verbOptions');
      this.translationBtn = document.getElementById('showTranslationBtn');
      this.nextBtn = document.getElementById('nextQuestionBtn');
      this.optionButtons = [];

      this.translationBtn.addEventListener('click', () => this.toggleTranslation());
      this.nextBtn.addEventListener('click', () => this.goToNextQuestion());
    }

    shuffleArray(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    initGame() {
      this.activeQuestions = this.shuffleArray([...this.questions]);
      this.currentIndex = 0;
      this.waitingForNext = false;
      this.errorLock = false;
      this.isAnswerCorrect = false;
      this.currentCorrectValue = null;
      this.correctAnswerForLock = null;
      this.flipContainer.classList.remove('flipped');
      this.removeCardHighlights();
      this.clearAllButtonsHighlight();
      this.renderOptionsButtons();
      this.renderCurrentQuestion();
      this.updateProgress();
      this.enableButtons(true);
      this.hideNextButton(true);
      this.feedbackSpan.innerText = '';
      this.gamePanel.classList.remove('hidden');
      this.completionPanel.classList.add('hidden');
    }

    updateProgress() {
      const total = this.activeQuestions.length;
      const current = this.currentIndex + 1;
      this.progressSpan.innerText = `${Math.min(current, total)} / ${total}`;
    }

    renderCurrentQuestion(resetToBlank = true) {
      if (this.currentIndex >= this.activeQuestions.length) {
        this.finishGame();
        return;
      }
      const q = this.activeQuestions[this.currentIndex];
      if (!this.isAnswerCorrect || resetToBlank) {
        this.sentenceDisplay.innerHTML = q.sentence.replace(/__________/g, '<span class="blank-highlight">_____</span>');
      } else {
        const filledHtml = q.sentence.replace(/__________/g, `<span class="blank-highlight filled-word">${this.currentCorrectValue}</span>`);
        this.sentenceDisplay.innerHTML = filledHtml;
      }
      this.translationDisplay.innerText = q.translation;
      if (this.flipContainer.classList.contains('flipped')) {
        this.flipContainer.classList.remove('flipped');
      }
    }

    renderOptionsButtons() {
      if (!this.activeQuestions.length) return;
      const currentQ = this.activeQuestions[this.currentIndex];
      const opts = currentQ.options;
      this.buttonsContainer.innerHTML = '';
      this.optionButtons = [];
      opts.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'verb-btn';
        btn.textContent = opt;
        btn.setAttribute('data-value', opt);
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          this.onAnswerClick(opt);
        });
        this.buttonsContainer.appendChild(btn);
        this.optionButtons.push(btn);
      });
    }

    removeCardHighlights() {
      this.frontCardEl.parentElement.classList.remove('correct-card', 'wrong-card');
    }

    highlightCardAsCorrect() {
      this.removeCardHighlights();
      this.frontCardEl.parentElement.classList.add('correct-card');
    }

    highlightCardAsWrong() {
      this.removeCardHighlights();
      this.frontCardEl.parentElement.classList.add('wrong-card');
    }

    clearAllButtonsHighlight() {
      if (!this.optionButtons) return;
      this.optionButtons.forEach(btn => {
        btn.classList.remove('correct-highlight', 'wrong-highlight');
      });
    }

    highlightCorrectButton(correctVal) {
      this.clearAllButtonsHighlight();
      const btn = this.optionButtons.find(b => b.textContent === correctVal);
      if (btn) btn.classList.add('correct-highlight');
    }

    highlightWrongButton(wrongVal) {
      this.clearAllButtonsHighlight();
      const btn = this.optionButtons.find(b => b.textContent === wrongVal);
      if (btn) btn.classList.add('wrong-highlight');
    }

    enableButtons(enabled) {
      this.optionButtons.forEach(btn => {
        if (enabled) {
          btn.classList.remove('disabled-btn');
        } else {
          btn.classList.add('disabled-btn');
        }
      });
    }

    hideNextButton(hide) {
      if (hide) {
        this.nextBtn.classList.add('hidden-next');
      } else {
        this.nextBtn.classList.remove('hidden-next');
      }
    }

    toggleTranslation() {
      if (this.waitingForNext) return;
      this.flipContainer.classList.toggle('flipped');
    }

    correctAnswer(selectedValue) {
      this.isAnswerCorrect = true;
      this.currentCorrectValue = selectedValue;
      this.highlightCardAsCorrect();
      this.highlightCorrectButton(selectedValue);
      this.feedbackSpan.innerText = '';
      
      const q = this.activeQuestions[this.currentIndex];
      const filledHtml = q.sentence.replace(/__________/g, `<span class="blank-highlight filled-word">${selectedValue}</span>`);
      this.sentenceDisplay.innerHTML = filledHtml;
      
      this.enableButtons(false);
      this.hideNextButton(false);
      this.waitingForNext = true;
    }
    
    wrongAnswer(selectedValue, correctValue) {
      if (this.waitingForNext) return;
      this.highlightCardAsWrong();
      this.highlightWrongButton(selectedValue);
      this.feedbackSpan.innerText = '';
      this.errorLock = true;
      this.correctAnswerForLock = correctValue;
    }
    
    fixErrorAfterWrong(correctValue) {
      this.isAnswerCorrect = true;
      this.currentCorrectValue = correctValue;
      this.highlightCardAsCorrect();
      this.highlightCorrectButton(correctValue);
      this.feedbackSpan.innerText = '';
      
      const q = this.activeQuestions[this.currentIndex];
      const filledHtml = q.sentence.replace(/__________/g, `<span class="blank-highlight filled-word">${correctValue}</span>`);
      this.sentenceDisplay.innerHTML = filledHtml;
      
      this.enableButtons(false);
      this.hideNextButton(false);
      this.waitingForNext = true;
      this.errorLock = false;
      this.correctAnswerForLock = null;
    }

    onAnswerClick(selected) {
      if (this.waitingForNext) {
        return;
      }
      const currentQ = this.activeQuestions[this.currentIndex];
      if (!currentQ) return;
      const correct = currentQ.correct;
      
      if (this.errorLock) {
        if (selected !== this.correctAnswerForLock) {
          this.highlightWrongButton(selected);
          setTimeout(() => {
            if (this.errorLock) this.clearAllButtonsHighlight();
          }, 500);
          return;
        } else {
          this.fixErrorAfterWrong(correct);
        }
        return;
      }
      
      if (selected === correct) {
        this.correctAnswer(selected);
      } else {
        this.wrongAnswer(selected, correct);
      }
    }
    
    goToNextQuestion() {
      if (!this.waitingForNext) return;
      
      this.currentIndex++;
      this.waitingForNext = false;
      this.errorLock = false;
      this.isAnswerCorrect = false;
      this.currentCorrectValue = null;
      this.correctAnswerForLock = null;
      this.removeCardHighlights();
      this.clearAllButtonsHighlight();
      this.feedbackSpan.innerText = '';
      this.hideNextButton(true);
      
      if (this.currentIndex < this.activeQuestions.length) {
        this.renderOptionsButtons();
        this.renderCurrentQuestion(true);
        this.updateProgress();
        this.enableButtons(true);
      } else {
        this.finishGame();
      }
    }

    finishGame() {
      this.gamePanel.classList.add('hidden');
      this.completionPanel.classList.remove('hidden');
      this.waitingForNext = false;
      this.errorLock = false;
      this.enableButtons(true);
      this.removeCardHighlights();
      this.clearAllButtonsHighlight();
      this.feedbackSpan.innerText = '';
      this.hideNextButton(true);
    }

    restartGame() {
      this.initGame();
    }
  }

  // ------------------------------------------------------------------
  // ЗАПУСК
  // ------------------------------------------------------------------
  document.addEventListener('DOMContentLoaded', () => {
    const gamePanel = document.getElementById('gamePanel');
    const completionPanel = document.getElementById('completionPanel');
    const progressSpan = document.getElementById('progressText');
    const sentenceDisplay = document.getElementById('sentenceDisplay');
    const translationDisplay = document.getElementById('translationDisplay');
    const feedbackSpan = document.getElementById('feedbackMsg');
    const flipContainer = document.getElementById('cardFlipContainer');
    const flipperEl = document.getElementById('flipper');
    const frontCardEl = document.getElementById('frontCard');
    const backCardEl = document.getElementById('backCard');
    const restartBtn = document.getElementById('restartCompletionBtn');
    
    const quiz = new ConjugationQuiz(QUESTIONS, gamePanel, completionPanel, progressSpan, sentenceDisplay, translationDisplay, feedbackSpan, flipContainer, flipperEl, frontCardEl, backCardEl);
    quiz.initGame();
    
    restartBtn.addEventListener('click', () => {
      quiz.restartGame();
    });
  });
</script>
