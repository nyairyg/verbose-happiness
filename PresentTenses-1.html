<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grammar Drill 01 — Verb Forms</title>
<style>
  :root{
    --paper:   #F5F4F0;
    --ink:     #16130F;
    --muted:   #8B857A;
    --line:    #D9D5CC;
    --accent:  #D64426;
    --correct: #2F7A4A;

    --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    --serif: Georgia, "Times New Roman", Times, serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }

  *{ box-sizing: border-box; }

  html, body{ margin: 0; padding: 0; }

  body{
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    min-height: 100vh;
  }

  ::selection{ background: var(--accent); color: #fff; }

  button{ font: inherit; color: inherit; }
  button:focus-visible{ outline: 2px solid var(--accent); outline-offset: 3px; }

  .wrap{
    max-width: 1060px;
    margin: 0 auto;
    padding: 46px 40px 90px;
  }

  /* ---------- header ---------- */

  .head{
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    gap: 24px;
    padding-bottom: 16px;
  }

  .mark,
  .sub{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  .sub{ color: var(--muted); letter-spacing: .08em; }

  /* ---------- progress ---------- */

  .progress{
    position: relative;
    height: 2px;
    background: var(--line);
    margin-bottom: 64px;
  }

  .progress .bar{
    position: absolute;
    inset: 0 auto 0 0;
    width: 0;
    background: var(--accent);
    transition: width .35s cubic-bezier(.4,0,.2,1);
  }

  /* ---------- layout ---------- */

  .grid{
    display: grid;
    grid-template-columns: minmax(0, 1fr) 190px;
    gap: 72px;
  }

  /* ---------- stage ---------- */

  .step{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    color: var(--muted);
    margin-bottom: 30px;
  }

  .step .cur{ color: var(--ink); }
  .step .dash{ margin: 0 .5em; }

  .sentence{
    font-family: var(--serif);
    font-size: clamp(27px, 4vw, 40px);
    line-height: 1.4;
    letter-spacing: -.005em;
    margin: 0 0 52px;
  }

  .blank{
    display: inline-block;
    min-width: 2.4em;
    padding: 0 .1em;
    text-align: center;
    border-bottom: 2px solid var(--ink);
    vertical-align: baseline;
    transition: color .25s ease, border-color .25s ease;
  }

  .blank.filled{
    color: var(--correct);
    border-color: var(--correct);
  }

  /* ---------- options ---------- */

  .options{
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    margin-bottom: 44px;
  }

  .opt{
    display: inline-flex;
    align-items: baseline;
    gap: 12px;
    padding: 13px 24px 15px;
    background: transparent;
    border: 1px solid var(--line);
    border-radius: 2px;
    font-family: var(--serif);
    font-size: 19px;
    line-height: 1;
    cursor: pointer;
    transition:
      border-color .15s ease,
      background .15s ease,
      color .15s ease,
      opacity .2s ease;
  }

  .opt .key{
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .06em;
    color: var(--muted);
    transition: color .15s ease;
  }

  .opt:hover:not(:disabled){ border-color: var(--ink); }
  .opt:disabled{ cursor: default; }

  /* correct pick — green */
  .opt.correct{
    background: var(--correct);
    border-color: var(--correct);
    color: #fff;
  }
  .opt.correct .key{ color: rgba(255,255,255,.6); }

  /* wrong pick — muted + shake, stays muted */
  .opt.wrong{
    border-color: var(--line);
    color: var(--muted);
    text-decoration: line-through;
    text-decoration-thickness: 1px;
    opacity: .4;
    animation: shake .42s cubic-bezier(.36,.07,.19,.97) both;
  }

  @keyframes shake{
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-5px); }
    40%, 60% { transform: translateX(5px); }
  }

  @media (prefers-reduced-motion: reduce){
    .opt.wrong{ animation: none; }
  }

  /* ---------- footer row ---------- */

  .foot{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    min-height: 38px;
    border-top: 1px solid var(--line);
    padding-top: 20px;
  }

  .verdict{
    margin: 0;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .verdict.is-ok{ color: var(--correct); }
  .verdict.is-no{ color: var(--muted); }

  .next{
    background: none;
    border: none;
    padding: 0 0 3px;
    border-bottom: 1px solid var(--ink);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    cursor: pointer;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s ease, color .15s ease, border-color .15s ease;
  }

  .next.show{ opacity: 1; pointer-events: auto; }
  .next:hover{ color: var(--accent); border-color: var(--accent); }

  /* ---------- result ---------- */

  .result-title{
    font-family: var(--serif);
    font-size: clamp(56px, 12vw, 108px);
    line-height: .95;
    letter-spacing: -.03em;
    margin: 0 0 18px;
  }

  .result-title .of{
    font-size: .28em;
    color: var(--muted);
    letter-spacing: 0;
    margin-left: .35em;
  }

  .result-note{
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .13em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 0 0 48px;
  }

  .restart{
    display: inline-block;
    padding: 14px 28px 15px;
    background: none;
    border: 1px solid var(--ink);
    border-radius: 2px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background .15s ease, color .15s ease;
  }

  .restart:hover{ background: var(--ink); color: var(--paper); }

  /* ---------- rail ---------- */

  .rail{
    border-left: 1px solid var(--line);
    padding-left: 32px;
  }

  .rail-block{ margin-bottom: 40px; }

  .label{
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  .score{
    font-family: var(--serif);
    font-size: 46px;
    line-height: 1;
    letter-spacing: -.02em;
  }

  .score .of{
    font-size: 15px;
    color: var(--muted);
    margin-left: 5px;
  }

  .hint{
    font-family: var(--mono);
    font-size: 11px;
    line-height: 2;
    letter-spacing: .04em;
    color: var(--muted);
  }

  /* ---------- responsive ---------- */

  @media (max-width: 860px){
    .wrap{ padding: 32px 22px 70px; }
    .grid{ grid-template-columns: 1fr; gap: 44px; }
    .progress{ margin-bottom: 44px; }
    .rail{
      border-left: none;
      padding-left: 0;
      border-top: 1px solid var(--line);
      padding-top: 26px;
      display: flex;
      gap: 56px;
    }
    .rail-block{ margin-bottom: 0; }
    .sentence{ margin-bottom: 38px; }
    .head{ flex-direction: column; gap: 6px; }
  }
</style>
</head>
<body>

<div class="wrap">

  <header class="head">
    <div class="mark">Grammar · Drill 01</div>
    <div class="sub">Verb Forms</div>
  </header>

  <div class="progress"><div class="bar" id="bar"></div></div>

  <main class="grid">

    <section id="stage" aria-live="polite"></section>

    <aside class="rail">
      <div class="rail-block">
        <div class="label">Score</div>
        <div class="score"><span id="score">0</span><span class="of">/ 50</span></div>
      </div>
      <div class="rail-block">
        <div class="label">Keys</div>
        <div class="hint">
          1 2 3 — answer<br>
          Enter — next
        </div>
      </div>
    </aside>

  </main>

</div>

<script>
(function () {

  const QUESTIONS = [
    { pre: "My parents",   post: "Math.",          opts: ["eat", "teach", "learns"],        a: 1 },
    { pre: "She",          post: "a newspaper.",   opts: ["reads", "writes", "watches"],    a: 0 },
    { pre: "He",           post: "to school.",     opts: ["plays", "studies", "goes"],      a: 2 },
    { pre: "They",         post: "pizza.",         opts: ["like", "wants", "eats"],         a: 0 },
    { pre: "I",            post: "a new phone.",   opts: ["needs", "want", "drinks"],       a: 1 },
    { pre: "We",           post: "help.",          opts: ["wants", "are", "need"],          a: 2 },
    { pre: "The dog",      post: "fast.",          opts: ["runs", "eat", "teaches"],        a: 0 },
    { pre: "The children", post: "in the park.",   opts: ["teaches", "play", "is"],         a: 1 },
    { pre: "My brother",   post: "at a bank.",     opts: ["works", "plays", "are"],         a: 0 },
    { pre: "You",          post: "mathematics.",   opts: ["teaches", "are", "study"],       a: 2 },
    { pre: "The teacher",  post: "the rule.",      opts: ["eats", "explains", "has"],       a: 1 },
    { pre: "She",          post: "a letter.",      opts: ["writes", "eats", "are"],         a: 0 },
    { pre: "They",         post: "TV.",            opts: ["reads", "is", "watch"],          a: 2 },
    { pre: "He",           post: "to music.",      opts: ["watches", "listens", "is"],      a: 1 },
    { pre: "I",            post: "coffee.",        opts: ["drink", "eats", "am"],           a: 0 },
    { pre: "We",           post: "dinner.",        opts: ["drinks", "are", "eat"],          a: 2 },
    { pre: "The baby",     post: ".",              opts: ["has", "sleeps", "is"],           a: 1 },
    { pre: "My friends",   post: "in London.",     opts: ["live", "works", "is"],           a: 0 },
    { pre: "She",          post: "math.",          opts: ["eats", "sings", "teaches"],      a: 2 },
    { pre: "He",           post: "medicine.",      opts: ["eats", "studies", "is"],         a: 1 },
    { pre: "They",         post: "English.",       opts: ["speak", "reads", "is"],          a: 0 },
    { pre: "We",           post: "football.",      opts: ["watches", "are", "play"],        a: 2 },
    { pre: "I",            post: "books.",         opts: ["writes", "read", "am"],          a: 1 },
    { pre: "You",          post: "poems.",         opts: ["write", "reads", "are"],         a: 0 },
    { pre: "The cat",      post: "fish.",          opts: ["drinks", "is", "eats"],          a: 2 },
    { pre: "My mother",    post: "dinner.",        opts: ["reads", "cooks", "is"],          a: 1 },
    { pre: "The students", post: "English.",       opts: ["learn", "teaches", "has"],       a: 0 },
    { pre: "He",           post: "a car.",         opts: ["ride", "is", "drives"],          a: 2 },
    { pre: "She",          post: "a song.",        opts: ["listens", "sings", "is"],        a: 1 },
    { pre: "They",         post: "well.",          opts: ["dance", "sings", "is"],          a: 0 },
    { pre: "I",            post: "tired.",         opts: ["am", "have", "gets"],            a: 0 },
    { pre: "She",          post: "a new bag.",     opts: ["is", "has", "want"],             a: 1 },
    { pre: "We",           post: "ready.",         opts: ["are", "has", "need"],            a: 0 },
    { pre: "The cat",      post: "sleeping.",      opts: ["have", "sleeps", "is"],          a: 2 },
    { pre: "You",          post: "my friend.",     opts: ["has", "are", "eats"],            a: 1 },
    { pre: "He",           post: "a doctor.",      opts: ["is", "need", "have"],            a: 0 },
    { pre: "They",         post: "a car.",         opts: ["wants", "am", "have"],           a: 2 },
    { pre: "It",           post: "rainy.",         opts: ["have", "is", "rains"],           a: 1 },
    { pre: "My father",    post: "at work.",       opts: ["is", "are", "have"],             a: 0 },
    { pre: "The shops",    post: "open.",          opts: ["have", "sell", "are"],           a: 2 },
    { pre: "She",          post: "French.",        opts: ["take", "speaks", "are"],         a: 1 },
    { pre: "He",           post: "Spanish.",       opts: ["speaks", "study", "haves"],      a: 0 },
    { pre: "The teacher",  post: "English.",       opts: ["eats", "are", "speaks"],         a: 2 },
    { pre: "My parents",   post: "teachers.",      opts: ["has", "are", "needs"],           a: 1 },
    { pre: "She",          post: "a new phone.",   opts: ["has", "spends", "is"],           a: 0 },
    { pre: "The children", post: "hungry.",        opts: ["plays", "eat", "are"],           a: 2 },
    { pre: "I",            post: "from Sweden.",   opts: ["have", "am", "comes"],           a: 1 },
    { pre: "He",           post: "a blue jacket.", opts: ["has", "want", "take"],           a: 0 },
    { pre: "We",           post: "ready.",         opts: ["has", "need", "are"],            a: 2 },
    { pre: "The dog",      post: "friendly.",      opts: ["get", "has", "is"],              a: 2 }
  ];

  const TOTAL = QUESTIONS.length;

  const stage   = document.getElementById('stage');
  const bar     = document.getElementById('bar');
  const scoreEl = document.getElementById('score');

  let index    = 0;
  let score    = 0;
  let solved   = false;
  let attempts = 0;

  const pad = n => String(n).padStart(2, '0');

  /* ---------- render ---------- */

  function render() {
    const q = QUESTIONS[index];
    solved   = false;
    attempts = 0;

    stage.innerHTML = `
      <div class="step">
        <span class="cur">${pad(index + 1)}</span><span class="dash">/</span>${pad(TOTAL)}
      </div>

      <p class="sentence">
        ${q.pre} <span class="blank" id="blank"></span> ${q.post}
      </p>

      <div class="options" id="options">
        ${q.opts.map((word, k) => `
          <button class="opt" type="button" data-k="${k}">
            <span class="key">${k + 1}</span><span class="word">${word}</span>
          </button>
        `).join('')}
      </div>

      <div class="foot">
        <p class="verdict" id="verdict"></p>
        <button class="next" id="next" type="button">Next &rarr;</button>
      </div>
    `;

    stage.querySelectorAll('.opt').forEach(btn => {
      btn.addEventListener('click', () => choose(Number(btn.dataset.k)));
    });

    document.getElementById('next').addEventListener('click', next);

    updateProgress();
  }

  /* ---------- answer ---------- */

  function choose(k) {
    if (solved) return;

    const q = QUESTIONS[index];
    const btn = stage.querySelector(`.opt[data-k="${k}"]`);
    if (!btn || btn.disabled) return;

    const verdict = document.getElementById('verdict');

    if (k === q.a) {
      /* ---- correct ---- */
      solved = true;

      btn.classList.add('correct');
      stage.querySelectorAll('.opt').forEach(b => { b.disabled = true; });

      const blank = document.getElementById('blank');
      blank.textContent = q.opts[q.a];
      blank.classList.add('filled');

      if (attempts === 0) score++;

      verdict.textContent = 'Correct';
      verdict.classList.remove('is-no');
      verdict.classList.add('is-ok');

      document.getElementById('next').classList.add('show');

      scoreEl.textContent = score;
      updateProgress();

    } else {
      /* ---- wrong: mute + shake, do NOT reveal correct ---- */
      attempts++;
      btn.disabled = true;
      btn.classList.add('wrong');

      verdict.textContent = 'Try again';
      verdict.classList.remove('is-ok');
      verdict.classList.add('is-no');
    }
  }

  /* ---------- navigation ---------- */

  function next() {
    if (!solved) return;

    index++;

    if (index >= TOTAL) finish();
    else render();
  }

  function updateProgress() {
    const done = index + (solved ? 1 : 0);
    bar.style.width = (done / TOTAL * 100) + '%';
  }

  /* ---------- end ---------- */

  function finish() {
    const percent = Math.round(score / TOTAL * 100);

    stage.innerHTML = `
      <div class="step"><span class="cur">Done</span><span class="dash">/</span>${pad(TOTAL)}</div>

      <h2 class="result-title">${score}<span class="of">/ ${TOTAL}</span></h2>

      <p class="result-note">${percent}% correct · first try</p>

      <button class="restart" id="restart" type="button">Start over</button>
    `;

    document.getElementById('restart').addEventListener('click', reset);

    bar.style.width = '100%';
  }

  function reset() {
    index  = 0;
    score  = 0;
    scoreEl.textContent = '0';
    render();
  }

  /* ---------- keyboard ---------- */

  document.addEventListener('keydown', e => {
    if (index >= TOTAL) return;

    if (!solved && ['1', '2', '3'].includes(e.key)) {
      const k = Number(e.key) - 1;
      if (k < QUESTIONS[index].opts.length) choose(k);
      return;
    }

    if (solved && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      next();
    }
  });

  /* ---------- start ---------- */

  render();

})();
</script>
</body>
</html>
