<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Interview with Esther Armstrong, 94</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Segoe UI,system-ui,sans-serif;color:#333;}
html,body{height:100%;}
body{
  background:#ffffff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:16px;
  touch-action:none;
}
.wrapper{
  width:100%;
  max-width:760px;
  display:flex;
  flex-direction:column;
  gap:14px;
  text-align:left;
}
h1{
  font-size:22px;
  font-weight:600;
  color:#444;
  text-align:left;
}
#chat{
  width:100%;
  border:2px solid #e2e8f0;
  border-radius:12px;
  background:#fafcff;
  padding:16px;
  min-height:260px;
  display:flex;
  flex-direction:column;
  gap:12px;
  overflow-y:auto;
}
.label{
  font-size:15px;
  font-weight:600;
  color:#556;
  text-align:left;
}
.word-container{
  display:flex;
  gap:10px;
  flex-wrap:wrap;
  width:100%;
}
.word{
  padding:8px 12px;
  background-color:#ffffff;
  border:2px solid #cbd5e1;
  border-radius:6px;
  cursor:grab;
  user-select:none;
  transition:transform .2s, background-color .2s, border-color .2s;
  touch-action:none;
  position:relative;
  z-index:1;
  box-shadow:0 1px 2px rgba(0,0,0,.04);
  font-size:15px;
}
.word.dragging{
  opacity:.8;
  background-color:#f1f5f9;
  z-index:1000;
  position:relative;
  box-shadow:0 4px 10px rgba(0,0,0,.12);
}
/* Esther block: label OUTSIDE the bubble, bubble right-aligned */
.esther-block{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-top:10px;
  width:100%;
}
.esther-block .label{
  align-self:flex-end;
}
.student-bubble{
  align-self:flex-end;
  background-color:#f1f5f9;
  color:#334155;
  padding:10px 14px;
  border-radius:12px;
  max-width:80%;
  border:1px solid #e2e8f0;
  font-style:italic;
  line-height:1.5;
  text-align:left;
  white-space:pre-wrap;
}
#result{
  font-size:15px;
  min-height:20px;
  text-align:left;
}
button{
  align-self:flex-start;
  padding:10px 22px;
  font-size:16px;
  border:2px solid #cbd5e1;
  border-radius:8px;
  background-color:#ffffff;
  cursor:pointer;
  transition:background-color .2s;
  color:#444;
}
button:hover{background-color:#f1f5f9;}
button:disabled{opacity:.55;cursor:default;}
</style>
</head>
<body>

<div class="wrapper">
  <h1>Interview with Esther Armstrong, 94</h1>

  <div id="chat">
    <!-- "Interviewer asks:" — outside the word container, as requested -->
    <div class="label" id="sentence-text">Interviewer asks:</div>
    <div class="word-container" id="word-container"></div>
    <!-- Esther block will be appended here after correct answer -->
  </div>

  <button id="actionBtn" onclick="handleAction()">Check Answer</button>
  <div id="result"></div>
</div>

<script>
// Interview with Esther Armstrong, 94
// question = interviewer's line -> scrambled word by word (student builds it)
// answer   = Esther's reply HINT: key words only, in correct order, separated by " / "
//            (function words are dropped — the student reconstructs the full sentence aloud)
const prompts = [
  {
    question: "How do you spend your day, Esther?",
    answer: "my day / normal. I / up / dressed / breakfast / to work"
  },
  {
    question: "What do you do?",
    answer: "accountant"
  },
  {
    question: "Why do you still work, Esther?",
    answer: "have / interest. / job / exciting"
  },
  {
    question: "What time do you start work?",
    answer: "start / 9 and 10 / every day / finish / 4 o'clock / not / stressful"
  },
  {
    question: "What do you usually do after work, Esther?",
    answer: "out / dinner / friends / two or three times / week / movies / theater / ballet"
  },
  {
    question: "Do you live alone?",
    answer: "yes / big apartment / someone / helps / housework / four hours / week / everything else / myself"
  },
  {
    question: "Do you have children, Esther?",
    answer: "yes / daughters / New York / one daughter / nearby / lunch / other daughter / eat together / two or three times / week / happy / life"
  }
];

let currentPrompt = 0;
let correctWords = [];
let scrambledWords = [];
let currentAnswer = "";
let solved = false;

const sentenceText = document.getElementById('sentence-text');
const container = document.getElementById('word-container');
const chat = document.getElementById('chat');
const resultDiv = document.getElementById('result');
const actionBtn = document.getElementById('actionBtn');

let dragged = null;
let isTouchDragging = false;
let touchDragOffsetX = 0;
let touchDragOffsetY = 0;

function shuffle(array) {
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function loadPrompt() {
  // Remove old Esther block(s)
  chat.querySelectorAll('.esther-block').forEach(b => b.remove());
  container.innerHTML = '';
  resultDiv.textContent = '';
  solved = false;
  actionBtn.disabled = false;
  actionBtn.textContent = "Check Answer";

  if (currentPrompt >= prompts.length) {
    sentenceText.textContent = "All prompts completed!";
    container.innerHTML = '';
    actionBtn.style.display = "none";
    return;
  }

  actionBtn.style.display = "inline-block";

  const item = prompts[currentPrompt];
  correctWords = item.question.trim().split(/\s+/);
  scrambledWords = shuffle([...correctWords]);
  currentAnswer = item.answer;

  sentenceText.textContent = "Interviewer asks:";

  scrambledWords.forEach(word => {
    const div = document.createElement('div');
    div.textContent = word;
    div.className = 'word';
    div.draggable = true;
    container.appendChild(div);
  });

  addDragEvents();
}

function addDragEvents() {
  container.querySelectorAll('.word').forEach(word => {
    word.addEventListener('dragstart', handleDragStart);
    word.addEventListener('dragend', handleDragEnd);
    word.addEventListener('touchstart', handleTouchStart);
    word.addEventListener('touchmove', handleTouchMove);
    word.addEventListener('touchend', handleTouchEnd);
    word.addEventListener('contextmenu', e => e.preventDefault());
  });
  container.addEventListener('dragover', handleDragOver);
  container.addEventListener('touchmove', handleContainerTouchMove, { passive: false });
  container.addEventListener('touchend', handleContainerTouchEnd);
}

function handleDragStart(e) {
  if (solved) return;
  dragged = e.target;
  e.target.classList.add('dragging');
  e.dataTransfer.setData('text/plain', '');
  resetBorders();
}

function handleDragEnd(e) {
  dragged = null;
  e.target.classList.remove('dragging');
}

function handleDragOver(e) {
  if (solved) return;
  e.preventDefault();
  if (!dragged) return;
  const afterElement = getDragAfterElement(container, e.clientX);
  if (afterElement == null) container.appendChild(dragged);
  else container.insertBefore(dragged, afterElement);
}

function getDragAfterElement(container, x) {
  const draggableElements = [...container.querySelectorAll('.word:not(.dragging)')];
  return draggableElements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = x - box.left - box.width / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset: offset, element: child };
    } else return closest;
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function handleTouchStart(e) {
  if (solved) return;
  e.preventDefault();
  const touch = e.touches[0];
  dragged = e.target;
  isTouchDragging = true;
  const rect = dragged.getBoundingClientRect();
  touchDragOffsetX = touch.clientX - rect.left;
  touchDragOffsetY = touch.clientY - rect.top;
  dragged.classList.add('dragging');
  resetBorders();
  dragged.style.position = 'fixed';
  dragged.style.left = rect.left + 'px';
  dragged.style.top = rect.top + 'px';
  dragged.style.width = rect.width + 'px';
  dragged.style.zIndex = '1000';
  dragged.style.transform = 'scale(1.05)';
}

function handleTouchMove(e) {
  if (!isTouchDragging || !dragged) return;
  e.preventDefault();
  const touch = e.touches[0];
  dragged.style.left = (touch.clientX - touchDragOffsetX) + 'px';
  dragged.style.top = (touch.clientY - touchDragOffsetY) + 'px';
}

function handleTouchEnd(e) {
  if (!isTouchDragging || !dragged) return;
  isTouchDragging = false;
  dragged.classList.remove('dragging');
  dragged.style.position = '';
  dragged.style.left = '';
  dragged.style.top = '';
  dragged.style.width = '';
  dragged.style.zIndex = '';
  dragged.style.transform = '';
  const touch = e.changedTouches[0];
  const elements = [...container.querySelectorAll('.word')];
  const droppedIndex = getTouchDropIndex(touch.clientX, touch.clientY, elements);
  if (droppedIndex !== -1 && dragged !== elements[droppedIndex]) {
    if (droppedIndex === elements.length - 1) {
      container.appendChild(dragged);
    } else {
      container.insertBefore(dragged, elements[droppedIndex]);
    }
  }
  dragged = null;
}

function handleContainerTouchMove(e) {
  if (isTouchDragging) e.preventDefault();
}

function handleContainerTouchEnd() {}

function getTouchDropIndex(x, y, elements) {
  for (let i = 0; i < elements.length; i++) {
    const elem = elements[i];
    const rect = elem.getBoundingClientRect();
    if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
      return i;
    }
  }
  return -1;
}

function resetBorders() {
  [...container.children].forEach(word => word.style.borderColor = '#cbd5e1');
}

// Single button: Check Answer -> (if correct) -> Next
function handleAction() {
  if (solved) {
    currentPrompt++;
    loadPrompt();
    return;
  }
  checkAnswer();
}

function checkAnswer() {
  const words = [...container.children].map(w => w.textContent);
  let isAllCorrect = true;

  [...container.children].forEach((wordDiv, i) => {
    if (words[i] === correctWords[i]) wordDiv.style.borderColor = '#86c29a';
    else {
      wordDiv.style.borderColor = '#e2a0a8';
      isAllCorrect = false;
    }
  });

  if (isAllCorrect) {
    solved = true;
    resultDiv.textContent = "Correct! 🎉 Now say Esther's reply aloud.";
    resultDiv.style.color = "#3a8c5a";

    // Esther block: label OUTSIDE the bubble (like "Interviewer asks:")
    const block = document.createElement('div');
    block.className = 'esther-block';

    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = 'Esther:';

    const bubble = document.createElement('div');
    bubble.className = 'student-bubble';
    bubble.textContent = currentAnswer; // key words chain, e.g. "my day / normal. I / up / dressed / breakfast / to work"

    block.appendChild(label);
    block.appendChild(bubble);
    chat.appendChild(block);
    chat.scrollTop = chat.scrollHeight;

    actionBtn.textContent = "Next";
    actionBtn.disabled = false;
    lockWords();
  } else {
    resultDiv.textContent = "Some words are incorrect. Try again.";
    resultDiv.style.color = "#b04a5a";
  }
}

function lockWords() {
  [...container.children].forEach(w => {
    w.draggable = false;
    w.style.cursor = 'default';
  });
}

loadPrompt();
</script>
</body>
</html>
