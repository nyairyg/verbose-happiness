<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Compound Nouns · Missing Word</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,450;0,500;0,550;0,600;0,620;0,700;1,400;1,450&display=swap" rel="stylesheet" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #f2f2f0;
            font-family: 'Bitter', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, serif;
            font-weight: 450;
            line-height: 1.5;
            padding: 1.5rem 1rem;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .card-container {
            max-width: 820px;
            width: 100%;
            margin: 0 auto;
        }

        .card {
            background: #ffffff;
            border-radius: 28px;
            box-shadow: 0 12px 28px -8px rgba(0, 0, 0, 0.08), 0 2px 4px -2px rgba(0, 0, 0, 0.02);
            padding: 2rem 2rem 1.8rem 2rem;
            border: 1px solid #eaeaea;
            display: flex;
            flex-direction: column;
            gap: 1.4rem;
            transition: all 0.3s ease;
        }

        .card.correct-card {
            border-color: #2b6e4f;
            background: #fafcfa;
        }

        .card.wrong-card {
            border-color: #b13e3e;
            background: #fcf8f8;
            animation: shake 0.4s ease;
        }

        @keyframes shake {
            0%,
            100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-6px);
            }
            75% {
                transform: translateX(6px);
            }
        }

        .step-title {
            font-size: 1.4rem;
            font-weight: 620;
            letter-spacing: -0.02em;
            color: #1a1a1a;
            padding-bottom: 0.4rem;
            border-bottom: 2px solid #e2e2e0;
            line-height: 1.2;
        }

        .step-subtitle {
            font-size: 0.9rem;
            font-weight: 430;
            color: #5e5e5c;
            line-height: 1.5;
            margin-top: -0.2rem;
        }

        .step-subtitle .mistake-info {
            display: inline-block;
            background: #f6f6f4;
            padding: 0.1rem 0.8rem;
            border-radius: 40px;
            font-size: 0.8rem;
            color: #6b6b66;
            margin-top: 0.2rem;
        }

        .phrase-container {
            background: #fafaf8;
            border-radius: 20px;
            padding: 1.8rem 1.8rem 1.2rem;
            border: 1px solid #eaeaea;
            text-align: center;
        }

        .phrase-display {
            font-size: 1.15rem;
            font-weight: 450;
            color: #1a1a1a;
            line-height: 2.4;
            margin-bottom: 0.8rem;
        }

        .phrase-display .text-part {
            display: inline;
        }

        .phrase-display .text-part.highlight-answer {
            color: #2b6e4f;
            font-weight: 600;
        }

        .phrase-display .text-part .ellipsis {
            display: inline-block;
            min-width: 40px;
            text-align: center;
            color: #1a1a1a;
            font-weight: 500;
            letter-spacing: 1px;
        }

        .phrase-display .text-part .ellipsis.filled {
            color: #2b6e4f;
            font-weight: 600;
        }

        .phrase-display .separator {
            color: #c0c0bc;
            margin: 0 8px;
            font-weight: 300;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.8rem;
            margin-top: 0.4rem;
        }

        .input-area input {
            font-family: 'Bitter', serif;
            font-weight: 450;
            font-size: 1.2rem;
            padding: 0.7rem 1.5rem;
            border: 2px solid #d0d0cc;
            border-radius: 60px;
            outline: none;
            width: 260px;
            text-align: center;
            background: #ffffff;
            color: #1a1a1a;
            transition: all 0.2s ease;
            letter-spacing: 0.5px;
        }

        .input-area input:focus {
            border-color: #6b6b66;
            box-shadow: 0 0 0 4px rgba(0, 0, 0, 0.04);
        }

        .input-area input:disabled {
            background: #f1f1ef;
            color: #2b6e4f;
            border-color: #c0c0bc;
        }

        .input-area input.correct-input {
            border-color: #2b6e4f;
            background: #eaf4ed;
        }

        .input-area input.wrong-input {
            border-color: #b13e3e;
            background: #f9f0f0;
        }

        .input-area input.hint-input {
            border-color: #b88b3a;
            background: #fdf8ee;
        }

        .input-area input.reveal-input {
            border-color: #2b6e4f;
            background: #eaf4ed;
            color: #2b6e4f;
            font-weight: 600;
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            font-family: 'Bitter', serif;
            font-weight: 520;
            font-size: 0.95rem;
            padding: 0.7rem 1.8rem;
            border: none;
            border-radius: 60px;
            cursor: pointer;
            transition: all 0.2s ease;
            background: #1a1a1a;
            color: #ffffff;
            min-width: 90px;
            letter-spacing: 0.2px;
        }

        .btn:hover:not(:disabled) {
            background: #33332f;
            transform: scale(0.98);
        }

        .btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            transform: none;
        }

        .btn-success {
            background: #2b6e4f;
        }

        .btn-success:hover:not(:disabled) {
            background: #1f5a3f;
        }

        .btn-outline {
            background: transparent;
            color: #2c2c2c;
            border: 1.5px solid #c0c0bc;
            padding: 0.6rem 1.6rem;
        }

        .btn-outline:hover:not(:disabled) {
            background: #eaeae6;
            border-color: #9a9a96;
        }

        .btn-outline.hidden {
            display: none;
        }

        .status-message {
            font-size: 0.9rem;
            font-weight: 450;
            padding: 0.3rem 0;
            text-align: center;
            min-height: 2rem;
        }

        .status-message .error {
            color: #b13e3e;
        }

        .status-message .success {
            color: #2b6e4f;
        }

        .status-message .info {
            color: #6b6b66;
        }

        .status-message .hint-text {
            color: #b88b3a;
        }

        .status-message .reveal-text {
            color: #2b6e4f;
            font-weight: 600;
        }

        .mistake-counter {
            font-size: 0.75rem;
            color: #8b8b8b;
            background: #f6f6f4;
            padding: 0.15rem 0.8rem;
            border-radius: 40px;
            display: inline-block;
        }

        .mistake-counter .count {
            font-weight: 600;
            color: #b13e3e;
        }

        .card-footer {
            border-top: 1px solid #efefed;
            padding-top: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.8rem;
        }

        .sentence-counter {
            font-size: 0.75rem;
            color: #8b8b8b;
            background: #f6f6f4;
            padding: 0.2rem 0.8rem;
            border-radius: 60px;
        }

        .dots {
            display: flex;
            gap: 6px;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        }

        .dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #d0d0cc;
            transition: all 0.3s ease;
        }

        .dot.active {
            background: #1a1a1a;
            transform: scale(1.25);
        }

        .dot.done {
            background: #2b6e4f;
        }

        .all-done-verb {
            font-size: 1.8rem;
            font-weight: 560;
            letter-spacing: -0.01em;
            color: #2b6e4f;
            border-bottom: 2px solid #d4e2da;
            display: inline-block;
            padding-bottom: 0.3rem;
        }

        .all-done-message {
            font-size: 1.1rem;
            font-weight: 430;
            color: #2c2c2c;
            text-align: center;
            line-height: 1.5;
        }

        .card.done-state {
            align-items: center;
            text-align: center;
        }

        .result-box {
            background: #fafaf8;
            border-radius: 20px;
            padding: 1.8rem 2rem;
            border: 1px solid #eaeaea;
            text-align: left;
        }

        .result-box .score {
            font-size: 2.6rem;
            font-weight: 620;
            color: #1a1a1a;
        }

        .result-box .score span {
            color: #2b6e4f;
        }

        .result-box .result-item {
            padding: 0.4rem 0;
            font-size: 1rem;
            border-bottom: 1px solid #efefed;
        }

        .result-box .result-item:last-child {
            border-bottom: none;
        }

        .result-box .result-item .correct-mark {
            color: #2b6e4f;
            margin-right: 8px;
        }

        .result-box .result-item .revealed-tag {
            font-size: 0.7rem;
            color: #b88b3a;
            background: #fdf8ee;
            padding: 0.1rem 0.6rem;
            border-radius: 40px;
            margin-left: 6px;
        }

        @media (max-width: 600px) {
            body {
                padding: 0.8rem;
            }
            .card {
                padding: 1.3rem;
                gap: 1rem;
            }
            .step-title {
                font-size: 1.2rem;
            }
            .phrase-display {
                font-size: 1rem;
                line-height: 2;
            }
            .input-area input {
                width: 180px;
                font-size: 1rem;
                padding: 0.6rem 1rem;
            }
            .btn {
                font-size: 0.85rem;
                padding: 0.6rem 1.2rem;
                min-width: 70px;
            }
            .phrase-container {
                padding: 1.2rem 1rem 1rem;
            }
            .phrase-display .separator {
                margin: 0 4px;
            }
        }
    </style>
</head>
<body>

    <div class="card-container">
        <div class="card" id="mainCard"></div>
    </div>

    <script>
        // ─── DATA ───────────────────────────────────────────────
        const groups = [{
            words: ['traffic jam', 'traffic lights', 'traffic warden'],
            answer: 'traffic'
        }, {
            words: ['car park', 'car rental', 'car wash'],
            answer: 'car'
        }, {
            words: ['shopping centre', 'shopping mall', 'shopping bag'],
            answer: 'shopping'
        }, {
            words: ['high street', 'one-way street', 'street corner'],
            answer: 'street'
        }, {
            words: ['semi-detached house', 'terraced house', 'houseboat'],
            answer: 'house'
        }, {
            words: ['housing estate', 'industrial estate', 'estate agent'],
            answer: 'estate'
        }, {
            words: ['primary school', 'language school', 'night school'],
            answer: 'school'
        }, {
            words: ['duty-free shop', 'gift shop', 'coffee shop'],
            answer: 'shop'
        }, {
            words: ['train station', 'train ticket', 'train driver'],
            answer: 'train'
        }, {
            words: ['football pitch', 'football match', 'football boot'],
            answer: 'football'
        }, {
            words: ['phone call', 'phone number', 'phone charger'],
            answer: 'phone'
        }, {
            words: ['wedding dress', 'wedding ring', 'wedding cake'],
            answer: 'wedding'
        }];

        // ─── STATE ──────────────────────────────────────────────
        let currentIndex = 0;
        let score = 0;
        let isAnswered = false;
        let completedItems = [];
        let mistakeCount = 0;

        // ─── DOM REFS ────────────────────────────────────────────
        const mainCard = document.getElementById('mainCard');

        // ─── HELPERS ─────────────────────────────────────────────
        function normalize(str) {
            return str.trim().toLowerCase().replace(/\s+/g, ' ');
        }

        function renderDots() {
            let dotsHtml = '';
            groups.forEach((_, i) => {
                let cls = 'dot';
                if (i < currentIndex) cls += ' done';
                if (i === currentIndex) cls += ' active';
                dotsHtml += `<span class="${cls}"></span>`;
            });
            return dotsHtml;
        }

        function getDisplayWord(fullWord, answer) {
            // Find where the answer appears in the full word
            const answerIndex = fullWord.toLowerCase().indexOf(answer.toLowerCase());
            if (answerIndex === -1) return fullWord;

            const before = fullWord.substring(0, answerIndex);
            const after = fullWord.substring(answerIndex + answer.length);

            // Return with ellipsis in place of the answer
            return before + '…' + after;
        }

        function renderStep() {
            if (currentIndex >= groups.length) {
                renderCompletion();
                return;
            }

            const group = groups[currentIndex];
            isAnswered = false;
            mistakeCount = 0;
            const answer = group.answer;

            // Build display with ellipsis in the correct position
            const displayWords = group.words.map(full => {
                return getDisplayWord(full, answer);
            });

            const titleHtml = `<div class="step-title">Complete the compound nouns</div>`;

            const subtitleHtml = `
                <div class="step-subtitle">
                    Each phrase shares the same missing word
                    <span class="mistake-info">💡 Hint after 2 mistakes · Answer revealed after 5 mistakes in this set</span>
                </div>
            `;

            const phraseHtml = `
                <div class="phrase-container">
                    <div class="phrase-display" id="phraseDisplay">
                        ${displayWords.map((text, idx) => 
                            `<span class="text-part">${text}</span>${idx < displayWords.length - 1 ? '<span class="separator">·</span>' : ''}`
                        ).join('')}
                    </div>
                    <div class="input-area">
                        <input type="text" id="answerInput" placeholder="…" autocomplete="off" spellcheck="false" />
                        <div class="btn-group">
                            <button class="btn" id="checkBtn">Check</button>
                            <button class="btn btn-outline hidden" id="nextBtn">Next →</button>
                        </div>
                        <div class="status-message" id="statusMessage"></div>
                        <div class="mistake-counter" id="mistakeCounter">Mistakes this set: <span class="count" id="mistakeCountDisplay">0</span> / 5</div>
                    </div>
                </div>
            `;

            const dotsHtml = `<div class="dots">${renderDots()}</div>`;

            const footerHtml = `
                <div class="card-footer">
                    <span class="sentence-counter">${currentIndex + 1} of ${groups.length}</span>
                    ${dotsHtml}
                </div>
            `;

            mainCard.innerHTML = titleHtml + subtitleHtml + phraseHtml + footerHtml;
            mainCard.className = 'card';

            // ─── EVENT LISTENERS ─────────────────────────────────
            const input = document.getElementById('answerInput');
            const checkBtn = document.getElementById('checkBtn');
            const nextBtn = document.getElementById('nextBtn');
            const statusMsg = document.getElementById('statusMessage');
            const mistakeCountDisplay = document.getElementById('mistakeCountDisplay');

            function updateMistakeCounter() {
                mistakeCountDisplay.textContent = mistakeCount;
            }

            function handleCheck() {
                if (isAnswered) return;

                const userAnswer = normalize(input.value);
                const correct = normalize(answer);

                if (userAnswer === '') {
                    statusMsg.innerHTML = `<span class="info">✏️ Please type a word.</span>`;
                    return;
                }

                if (userAnswer === correct) {
                    // Correct!
                    score++;
                    isAnswered = true;
                    statusMsg.innerHTML = `<span class="success">✓ Correct!</span>`;
                    mainCard.className = 'card correct-card';
                    input.className = 'correct-input';
                    input.disabled = true;
                    checkBtn.disabled = true;

                    // Update display to show full words
                    const phraseDisplay = document.getElementById('phraseDisplay');
                    phraseDisplay.innerHTML = group.words.map((full, idx) =>
                        `<span class="text-part highlight-answer">${full}</span>${idx < group.words.length - 1 ? '<span class="separator">·</span>' : ''}`
                    ).join('');

                    // Store completed
                    completedItems.push({
                        words: group.words,
                        answer: answer,
                        revealed: false
                    });

                    // Show next button
                    nextBtn.classList.remove('hidden');
                    setTimeout(() => nextBtn.focus(), 100);

                } else {
                    // Wrong
                    mistakeCount++;
                    statusMsg.innerHTML = `<span class="error">✗ Not quite. Try again.</span>`;
                    mainCard.className = 'card wrong-card';
                    input.className = 'wrong-input';
                    updateMistakeCounter();

                    // After 2 mistakes in this set, show hint with first letter
                    if (mistakeCount >= 2 && !isAnswered) {
                        const firstLetter = answer.charAt(0);
                        input.placeholder = `${firstLetter}…`;
                        input.className = 'hint-input';
                        statusMsg.innerHTML = `<span class="hint-text">💡 The word starts with "${firstLetter}"</span>`;
                    }

                    // After 5 mistakes in this set, reveal the answer
                    if (mistakeCount >= 5 && !isAnswered) {
                        input.value = answer;
                        input.className = 'reveal-input';
                        input.disabled = true;
                        statusMsg.innerHTML = `<span class="reveal-text">💡 The answer is "${answer}"</span>`;
                        checkBtn.disabled = true;

                        // Mark as completed (counts as correct for progress)
                        score++;
                        isAnswered = true;
                        mainCard.className = 'card correct-card';

                        // Update display to show full words
                        const phraseDisplay = document.getElementById('phraseDisplay');
                        phraseDisplay.innerHTML = group.words.map((full, idx) =>
                            `<span class="text-part highlight-answer">${full}</span>${idx < group.words.length - 1 ? '<span class="separator">·</span>' : ''}`
                        ).join('');

                        // Store completed with revealed flag
                        completedItems.push({
                            words: group.words,
                            answer: answer,
                            revealed: true
                        });

                        // Show next button
                        nextBtn.classList.remove('hidden');
                        setTimeout(() => nextBtn.focus(), 100);
                        return;
                    }

                    setTimeout(() => {
                        if (!isAnswered) {
                            mainCard.className = 'card';
                            if (mistakeCount < 2) {
                                input.className = '';
                                statusMsg.innerHTML = '';
                            } else {
                                // Keep hint
                                input.className = 'hint-input';
                                const firstLetter = answer.charAt(0);
                                statusMsg.innerHTML = `<span class="hint-text">💡 The word starts with "${firstLetter}"</span>`;
                            }
                        }
                    }, 600);
                    input.select();
                }
            }

            function handleNext() {
                if (!isAnswered) return;
                currentIndex++;
                renderStep();
            }

            // Check button click
            checkBtn.addEventListener('click', handleCheck);

            // Next button click
            nextBtn.addEventListener('click', handleNext);

            // Enter key support
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    if (!isAnswered) {
                        handleCheck();
                    } else {
                        handleNext();
                    }
                }
            });

            // Also support Enter on the next button when it's focused
            nextBtn.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    handleNext();
                }
            });

            updateMistakeCounter();
            setTimeout(() => input.focus(), 200);
        }

        function renderCompletion() {
            const titleHtml = `<div class="all-done-verb">✓ All done</div>`;
            const messageHtml = `<div class="all-done-message">You've completed all ${groups.length} sets!</div>`;

            let resultItemsHtml = '';
            completedItems.forEach((item, idx) => {
                const wordsDisplay = item.words.map(w =>
                    `<span class="highlight-answer">${w}</span>`
                ).join(' · ');
                const revealedTag = item.revealed ? `<span class="revealed-tag">revealed</span>` : '';
                resultItemsHtml += `
                    <div class="result-item">
                        <span class="correct-mark">✓</span>
                        ${wordsDisplay} ${revealedTag}
                    </div>
                `;
            });

            const resultBoxHtml = `
                <div class="result-box">
                    <div class="score"><span>${score}</span> / ${groups.length}</div>
                    <p style="color:#5e5e5c; margin-bottom:1rem;">All correct answers:</p>
                    ${resultItemsHtml}
                </div>
            `;

            const restartHtml = `
                <button class="btn btn-success" id="restartBtn" style="margin-top:0.5rem;">↺ Start again</button>
            `;

            mainCard.innerHTML = titleHtml + messageHtml + resultBoxHtml + restartHtml;
            mainCard.className = 'card done-state';

            document.getElementById('restartBtn').addEventListener('click', () => {
                currentIndex = 0;
                score = 0;
                completedItems = [];
                isAnswered = false;
                mistakeCount = 0;
                renderStep();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            });
        }

        // ─── INIT ────────────────────────────────────────────────
        renderStep();
    </script>

</body>
</html>
