<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connect · airport</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f7f5f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      padding: 1.5rem;
    }

    .card {
      max-width: 1200px;
      width: 100%;
      background: #f7f5f0;
      display: grid;
      grid-template-columns: 1fr 1.2fr;
      gap: 2.5rem;
      align-items: start;
      box-shadow: none;
      border: none;
    }

    .left-column {
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
    }

    .word-list {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    .word-item {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
      font-size: 1.4rem;
      font-weight: 350;
      letter-spacing: 0.01em;
      color: #1e1e1e;
      border-bottom: 1px solid #e0dbd1;
      padding-bottom: 0.5rem;
      line-height: 1.4;
    }

    .number-slot {
      display: inline-block;
      width: 2.8rem;
      text-align: center;
      font-size: 1.4rem;
      font-weight: 400;
      color: #1e1e1e;
      background: transparent;
      border: none;
      border-bottom: 2px solid #cbc3b5;
      outline: none;
      padding: 0 0.1rem;
      font-family: inherit;
      transition: border-color 0.1s ease;
      min-width: 2.8rem;
    }

    .number-slot:focus {
      border-bottom-color: #8a7f6e;
    }

    .number-slot::placeholder {
      color: #d6cec1;
      font-size: 1rem;
      opacity: 0.5;
      letter-spacing: 0.05em;
    }

    /* правильные и неправильные ответы */
    .number-slot.correct {
      border-bottom-color: #4a8c5c;
      color: #4a8c5c;
    }

    .number-slot.incorrect {
      border-bottom-color: #b55a5a;
      color: #b55a5a;
    }

    .word-text {
      font-weight: 380;
      color: #1e1e1e;
      letter-spacing: 0.02em;
      padding-left: 0.1rem;
    }

    .image-placeholder {
      background: transparent;
      border: none;
      aspect-ratio: 3 / 4;
      width: 100%;
      max-width: 480px;
      justify-self: end;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .image-placeholder img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .instruction {
      grid-column: 1 / -1;
      text-align: left;
      font-size: 1.2rem;
      font-weight: 350;
      letter-spacing: 0.04em;
      color: #2c2822;
      padding-bottom: 0.75rem;
      border-bottom: 1px solid #ddd7cb;
      margin-bottom: 0.5rem;
      text-transform: none;
    }

    /* счётчик и кнопка */
    .counter-area {
      display: flex;
      align-items: center;
      gap: 1.5rem;
      padding-top: 0.5rem;
    }

    .counter {
      font-size: 1.1rem;
      font-weight: 350;
      color: #2c2822;
      letter-spacing: 0.02em;
    }

    .counter span {
      font-weight: 500;
    }

    .check-btn {
      background: transparent;
      border: 1px solid #cbc3b5;
      padding: 0.4rem 1.2rem;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 350;
      color: #2c2822;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.04em;
    }

    .check-btn:hover {
      background: #ece8e0;
      border-color: #b5ab9a;
    }

    .check-btn:active {
      background: #ddd7cb;
    }

    .reset-btn {
      background: transparent;
      border: 1px solid #cbc3b5;
      padding: 0.4rem 1.2rem;
      font-size: 0.95rem;
      font-family: inherit;
      font-weight: 350;
      color: #2c2822;
      cursor: pointer;
      transition: all 0.15s ease;
      letter-spacing: 0.04em;
    }

    .reset-btn:hover {
      background: #ece8e0;
      border-color: #b5ab9a;
    }

    .reset-btn:active {
      background: #ddd7cb;
    }

    @media (max-width: 700px) {
      .card {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      .image-placeholder {
        max-width: 100%;
        aspect-ratio: 3 / 4;
        justify-self: center;
        width: 100%;
      }
      .instruction {
        text-align: center;
      }
      .word-item {
        font-size: 1.3rem;
      }
      .number-slot {
        width: 2.6rem;
        min-width: 2.6rem;
      }
      .counter-area {
        flex-wrap: wrap;
        justify-content: center;
      }
    }

    @media (max-width: 400px) {
      .word-item {
        font-size: 1.1rem;
        gap: 0.3rem;
      }
      .number-slot {
        width: 2.4rem;
        min-width: 2.4rem;
        font-size: 1.1rem;
      }
      .card {
        gap: 1.5rem;
      }
    }

    input[type="text"]::-webkit-outer-spin-button,
    input[type="text"]::-webkit-inner-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type="text"] {
      -moz-appearance: textfield;
      appearance: textfield;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="instruction">Connect the words, based on the picture</div>

    <!-- левая колонка: слова + счётчик -->
    <div class="left-column">
      <div class="word-list">
        <!-- заполняется через JavaScript -->
      </div>

      <div class="counter-area">
        <div class="counter">Correct: <span id="scoreDisplay">0</span> / 12</div>
        <button class="check-btn" id="checkBtn">Check</button>
        <button class="reset-btn" id="resetBtn">Reset</button>
      </div>
    </div>

    <!-- правая колонка: изображение -->
    <div class="image-placeholder">
      <img src="https://nyairyg.github.io/verbose-happiness/AEF2-Airport.png" alt="Airport diagram for vocabulary exercise">
    </div>
  </div>

  <script>
    (function() {
      // правильные ответы: [номер, слово]
      const wordData = [
        [3, "arrivals"],
        [7, "baggage check-in"],
        [1, "baggage claim"],
        [6, "cart"],
        [9, "check-in"],
        [8, "customs"],
        [2, "departures"],
        [5, "elevators"],
        [11, "gates"],
        [10, "passport control"],
        [12, "security check"],
        [4, "terminal"]
      ];

      const wordListContainer = document.querySelector('.word-list');
      const scoreDisplay = document.getElementById('scoreDisplay');
      const checkBtn = document.getElementById('checkBtn');
      const resetBtn = document.getElementById('resetBtn');

      if (!wordListContainer) return;

      // храним все поля ввода
      let inputs = [];

      // функция для подсчёта правильных ответов
      function calculateScore() {
        let correct = 0;
        inputs.forEach((input, index) => {
          const expected = wordData[index][0].toString();
          const userValue = input.value.trim();
          
          // убираем старые классы
          input.classList.remove('correct', 'incorrect');
          
          if (userValue === '') {
            // пустое поле — ничего не делаем
            return;
          }
          
          if (userValue === expected) {
            input.classList.add('correct');
            correct++;
          } else {
            input.classList.add('incorrect');
          }
        });
        
        scoreDisplay.textContent = correct;
        return correct;
      }

      // функция для сброса
      function resetAll() {
        inputs.forEach(input => {
          input.value = '';
          input.classList.remove('correct', 'incorrect');
        });
        scoreDisplay.textContent = '0';
      }

      // строим список слов
      wordData.forEach(([number, word]) => {
        const item = document.createElement('div');
        item.className = 'word-item';

        const input = document.createElement('input');
        input.type = 'text';
        input.className = 'number-slot';
        input.maxLength = 2;
        input.placeholder = '·';
        input.setAttribute('aria-label', `number for ${word}`);
        
        // разрешаем ввод только цифр, максимум 2
        input.addEventListener('input', function(e) {
          this.value = this.value.replace(/\D/g, '').slice(0, 2);
          // убираем подсветку при редактировании
          this.classList.remove('correct', 'incorrect');
          // обновляем счётчик (показываем только правильные, без подсветки неправильных)
          // но чтобы не сбивать, просто обновляем число правильно заполненных
          updateScoreWithoutHighlight();
        });
        
        input.addEventListener('paste', function(e) {
          e.preventDefault();
          const pasted = (e.clipboardData || window.clipboardData).getData('text');
          const digits = pasted.replace(/\D/g, '').slice(0, 2);
          if (digits) {
            this.value = digits;
            this.classList.remove('correct', 'incorrect');
            updateScoreWithoutHighlight();
          }
        });

        const wordSpan = document.createElement('span');
        wordSpan.className = 'word-text';
        wordSpan.textContent = word;

        item.appendChild(input);
        item.appendChild(wordSpan);
        wordListContainer.appendChild(item);
        
        // сохраняем ссылку на поле
        inputs.push(input);
      });

      // функция для обновления счётчика без подсветки (только правильные)
      function updateScoreWithoutHighlight() {
        let correct = 0;
        inputs.forEach((input, index) => {
          const expected = wordData[index][0].toString();
          const userValue = input.value.trim();
          if (userValue === expected) {
            correct++;
          }
        });
        scoreDisplay.textContent = correct;
      }

      // кнопка Check — полная проверка с подсветкой
      checkBtn.addEventListener('click', function() {
        calculateScore();
      });

      // кнопка Reset — очищает всё
      resetBtn.addEventListener('click', function() {
        resetAll();
      });

      // также по нажатию Enter можно запускать проверку
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.target.closest('.number-slot')) {
          // если пользователь нажал Enter в поле ввода — проверяем
          calculateScore();
        }
      });

      // инициализация счётчика
      updateScoreWithoutHighlight();
    })();
  </script>
</body>
</html>
