<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>A2 Speak: Make Sentences</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #faf8f5;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem 1.5rem;
            color: #1a1a1a;
        }

        .container {
            max-width: 780px;
            width: 100%;
            margin: 0 auto;
        }

        .exercise {
            background: #fefcf9;
            border: 1px solid #e8e3da;
            padding: 2.5rem 2rem;
        }

        .prompt {
            background: transparent;
            text-align: center;
            padding: 2rem 1rem;
            border-bottom: 1px solid #e2dcd3;
            border-top: 1px solid #e2dcd3;
            margin-bottom: 2rem;
        }

        .words {
            font-size: 2.2rem;
            font-weight: 500;
            letter-spacing: -0.01em;
            color: #2c2c2c;
            word-break: break-word;
            line-height: 1.3;
        }

        .mic-area {
            display: flex;
            justify-content: center;
            margin: 2rem 0 1.8rem;
        }

        .mic-btn {
            background: #1a1a1a;
            border: none;
            border-radius: 0;
            width: 80px;
            height: 80px;
            cursor: pointer;
            transition: all 0.15s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #faf8f5;
            font-size: 2.4rem;
            box-shadow: none;
        }

        .mic-btn:hover {
            background: #2e2e2e;
        }

        .mic-btn:active {
            transform: scale(0.96);
        }

        .mic-btn.listening {
            background: #b33b2c;
            animation: subtlePulse 1.2s infinite;
        }

        @keyframes subtlePulse {
            0% { opacity: 0.9; }
            50% { opacity: 0.65; }
            100% { opacity: 0.9; }
        }

        .result {
            text-align: center;
            padding: 1rem 0.5rem;
            margin: 1.2rem 0;
            font-size: 1rem;
            font-weight: 400;
            color: #5a5a5a;
            min-height: 85px;
            border-top: 1px solid #ece6df;
        }

        .result-correct {
            color: #2c6e2f;
            font-weight: 500;
        }

        .result-wrong {
            color: #b33b2c;
        }

        .progress {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            margin-top: 1.8rem;
            font-size: 0.85rem;
            color: #7e7a72;
            letter-spacing: 0.3px;
            font-weight: 450;
        }

        .counter {
            font-weight: 600;
            color: #2c2c2c;
        }

        .nav-buttons {
            display: flex;
            gap: 1rem;
            margin-top: 1.2rem;
        }

        .nav-btn {
            background: none;
            border: 1px solid #d6cfc4;
            padding: 0.6rem 1.6rem;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.1s linear;
            color: #2c2c2c;
        }

        .nav-btn:hover {
            background: #eee9e2;
            border-color: #bfb6a8;
        }

        .nav-btn:active {
            transform: translateY(1px);
        }

        .status-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            background: #cbc3b7;
            border-radius: 0;
            margin-right: 8px;
        }

        hr {
            border: none;
            border-top: 1px solid #e8e2d9;
            margin: 0.6rem 0;
        }

        @media (max-width: 550px) {
            .exercise {
                padding: 1.5rem;
            }
            .words {
                font-size: 1.6rem;
            }
            .mic-btn {
                width: 70px;
                height: 70px;
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="exercise">
        <div class="prompt">
            <div class="words" id="promptWords">my mother / be / a nice woman</div>
        </div>

        <div class="mic-area">
            <button class="mic-btn" id="micButton">🎙️</button>
        </div>

        <div class="result" id="resultArea">
            <span class="status-dot"></span> press mic and speak
        </div>

        <div class="progress">
            <span class="counter" id="sentenceCounter">1</span>
            <span> / 20</span>
            <span style="font-size: 0.75rem;">⏺ say full sentence</span>
        </div>
        <div class="nav-buttons">
            <button class="nav-btn" id="prevBtn">← previous</button>
            <button class="nav-btn" id="nextBtn">next →</button>
        </div>
        <hr />
    </div>
</div>

<script>
    const sentences = [
        { chunks: "my mother / be / a nice woman",          correct: "my mother is a nice woman" },
        { chunks: "they / be / at home",                    correct: "they are at home" },
        { chunks: "she / have got / a new bag",             correct: "she has got a new bag" },
        { chunks: "we / want / some coffee",                correct: "we want some coffee" },
        { chunks: "he / can / play the guitar",             correct: "he can play the guitar" },
        { chunks: "my sister / work / in a hospital",       correct: "my sister works in a hospital" },
        { chunks: "i / be / very happy today",              correct: "i am very happy today" },
        { chunks: "they / like / pizza",                    correct: "they like pizza" },
        { chunks: "tom / go / to school every day",         correct: "tom goes to school every day" },
        { chunks: "we / be / good friends",                 correct: "we are good friends" },
        { chunks: "she / do / her homework",                correct: "she does her homework" },
        { chunks: "you / be / a great student",             correct: "you are a great student" },
        { chunks: "my father / drive / a black car",        correct: "my father drives a black car" },
        { chunks: "it / be / a sunny day",                  correct: "it is a sunny day" },
        { chunks: "peter and anna / live / in Berlin",      correct: "peter and anna live in berlin" },
        { chunks: "i / have / two brothers",                correct: "i have two brothers" },
        { chunks: "the cat / sleep / on the sofa",          correct: "the cat sleeps on the sofa" },
        { chunks: "you / can / help me",                    correct: "you can help me" },
        { chunks: "we / need / to buy milk",                correct: "we need to buy milk" },
        { chunks: "he / be / a good teacher",               correct: "he is a good teacher" }
    ];

    let currentIdx = 0;
    let recognition = null;
    let isListening = false;
    let retryCount = 0;
    let retryTimeout = null;

    const promptWordsSpan = document.getElementById("promptWords");
    const micBtn = document.getElementById("micButton");
    const resultArea = document.getElementById("resultArea");
    const sentenceCounterSpan = document.getElementById("sentenceCounter");
    const prevBtn = document.getElementById("prevBtn");
    const nextBtn = document.getElementById("nextBtn");

    function normalizeForCompare(str) {
        return str.toLowerCase()
            .replace(/[^\w\s']/g, '')
            .replace(/\s+/g, ' ')
            .trim();
    }

    function isAnswerCorrect(spokenRaw, correctRaw) {
        const spokenNorm = normalizeForCompare(spokenRaw);
        const correctNorm = normalizeForCompare(correctRaw);
        
        if (spokenNorm === correctNorm) return true;
        
        const spokenWords = spokenNorm.split(/\s+/);
        const correctWords = correctNorm.split(/\s+/);
        
        let matchCount = 0;
        for (let cw of correctWords) {
            if (spokenWords.includes(cw)) matchCount++;
        }
        const ratio = matchCount / correctWords.length;
        
        const hasCorrectBe = /\b(am|are|is)\b/.test(correctNorm);
        if (hasCorrectBe) {
            const hasSpokenBe = /\b(am|are|is)\b/.test(spokenNorm);
            if (!hasSpokenBe && correctNorm.includes("is") && !spokenNorm.includes("is")) return false;
            if (!hasSpokenBe && correctNorm.includes("are") && !spokenNorm.includes("are")) return false;
            if (!hasSpokenBe && correctNorm.includes("am") && !spokenNorm.includes("am")) return false;
        }
        
        if (correctNorm.includes("has got") && !spokenNorm.includes("has got")) return false;
        if (correctNorm.includes("have got") && !spokenNorm.includes("have got") && !spokenNorm.includes("have")) return false;
        
        return ratio >= 0.75;
    }

    function loadSentence() {
        const sentence = sentences[currentIdx];
        promptWordsSpan.innerText = sentence.chunks;
        resultArea.innerHTML = `<span class="status-dot"></span> press mic and speak`;
        resultArea.classList.remove("result-correct", "result-wrong");
        sentenceCounterSpan.innerText = currentIdx + 1;
        
        if (recognition && isListening) {
            try { recognition.abort(); } catch(e) {}
            isListening = false;
            micBtn.classList.remove("listening");
            micBtn.innerHTML = "🎙️";
        }
        
        // clear any pending retry
        if (retryTimeout) {
            clearTimeout(retryTimeout);
            retryTimeout = null;
        }
        retryCount = 0;
    }

    function setFeedback(correctFlag, spokenText, expectedText) {
        if (correctFlag) {
            resultArea.innerHTML = `<span class="status-dot"></span> ✓ "${spokenText}"`;
            resultArea.classList.add("result-correct");
            resultArea.classList.remove("result-wrong");
        } else {
            resultArea.innerHTML = `<span class="status-dot"></span> ✗ "${spokenText}"<br><span style="font-size:0.85rem; opacity:0.8;">→ ${expectedText}</span>`;
            resultArea.classList.add("result-wrong");
            resultArea.classList.remove("result-correct");
        }
    }

    function createRecognition() {
        const SpeechRecog = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecog) {
            resultArea.innerHTML = `<span class="status-dot"></span> browser does not support speech recognition`;
            micBtn.disabled = true;
            micBtn.style.opacity = "0.5";
            return null;
        }
        
        const recog = new SpeechRecog();
        recog.continuous = false;
        recog.interimResults = false;
        recog.lang = "en-US";
        
        // CRITICAL: these prevent network/timeout errors
        recog.maxAlternatives = 1;
        recog.audioSampleRate = 44100;  // not standard but helps in some impl
        // These properties help with stability
        if ('speechRecognition' in window) {
            // Some browsers need these
            try {
                recog.interimResults = false;
            } catch(e) {}
        }
        
        recog.onstart = () => {
            isListening = true;
            micBtn.classList.add("listening");
            micBtn.innerHTML = "🔴";
            resultArea.innerHTML = `<span class="status-dot"></span> listening... speak now`;
            resultArea.classList.remove("result-correct", "result-wrong");
            retryCount = 0; // reset retry counter on successful start
        };
        
        recog.onerror = (event) => {
            console.error("Speech error:", event.error);
            
            // Handle network error specifically - retry automatically
            if (event.error === "network" || event.error === "service-not-allowed") {
                if (retryCount < 3) {
                    retryCount++;
                    resultArea.innerHTML = `<span class="status-dot"></span> retrying... (${retryCount}/3)`;
                    // Auto retry after short delay
                    if (retryTimeout) clearTimeout(retryTimeout);
                    retryTimeout = setTimeout(() => {
                        if (!isListening) {
                            try {
                                recognition.start();
                            } catch(e) {
                                resultArea.innerHTML = `<span class="status-dot"></span> click mic to try again`;
                                micBtn.classList.remove("listening");
                                micBtn.innerHTML = "🎙️";
                                isListening = false;
                            }
                        }
                    }, 800);
                } else {
                    resultArea.innerHTML = `<span class="status-dot"></span> mic error: ${event.error}. click again`;
                    retryCount = 0;
                    isListening = false;
                    micBtn.classList.remove("listening");
                    micBtn.innerHTML = "🎙️";
                }
                return;
            }
            
            // Other errors
            isListening = false;
            micBtn.classList.remove("listening");
            micBtn.innerHTML = "🎙️";
            
            if (event.error === "not-allowed") {
                resultArea.innerHTML = `<span class="status-dot"></span> microphone access denied — allow in browser`;
            } else if (event.error === "no-speech") {
                resultArea.innerHTML = `<span class="status-dot"></span> no speech detected — press mic and speak clearly`;
            } else if (event.error === "audio-capture") {
                resultArea.innerHTML = `<span class="status-dot"></span> no microphone found — check device`;
            } else {
                resultArea.innerHTML = `<span class="status-dot"></span> ${event.error} — press mic again`;
            }
            resultArea.classList.remove("result-correct", "result-wrong");
        };
        
        recog.onresult = (event) => {
            const lastResult = event.results[event.results.length - 1];
            const spoken = lastResult[0].transcript.trim();
            const currentCorrect = sentences[currentIdx].correct;
            
            const isCorrect = isAnswerCorrect(spoken, currentCorrect);
            let displaySpoken = spoken.length > 45 ? spoken.substring(0, 42) + "..." : spoken;
            setFeedback(isCorrect, displaySpoken, currentCorrect);
            
            isListening = false;
            micBtn.classList.remove("listening");
            micBtn.innerHTML = "🎙️";
            retryCount = 0;
        };
        
        recog.onend = () => {
            if (isListening) {
                // If ended without result and no error was processed
                if (retryCount === 0) {
                    // Brief timeout to see if another result arrives
                    setTimeout(() => {
                        if (isListening) {
                            isListening = false;
                            micBtn.classList.remove("listening");
                            micBtn.innerHTML = "🎙️";
                            if (!resultArea.innerHTML.includes("✓") && !resultArea.innerHTML.includes("✗")) {
                                resultArea.innerHTML = `<span class="status-dot"></span> say the sentence — press mic`;
                            }
                        }
                    }, 100);
                } else {
                    isListening = false;
                    micBtn.classList.remove("listening");
                    micBtn.innerHTML = "🎙️";
                }
            }
        };
        
        return recog;
    }

    function startListening() {
        // Clean up any pending retries
        if (retryTimeout) {
            clearTimeout(retryTimeout);
            retryTimeout = null;
        }
        
        // Re-initialize if needed (fixes stuck states)
        if (!recognition) {
            recognition = createRecognition();
            if (!recognition) return;
        }
        
        // If already listening, stop and restart fresh
        if (isListening) {
            try {
                recognition.abort();
            } catch(e) {}
            isListening = false;
            micBtn.classList.remove("listening");
            micBtn.innerHTML = "🎙️";
            // Short delay before restart
            setTimeout(() => {
                startListening();
            }, 150);
            return;
        }
        
        try {
            retryCount = 0;
            recognition.lang = "en-US";
            recognition.start();
        } catch(e) {
            console.error("Start error:", e);
            resultArea.innerHTML = `<span class="status-dot"></span> click again to speak`;
            // If error, destroy and recreate
            recognition = null;
        }
    }
    
    function prevSentence() {
        if (retryTimeout) clearTimeout(retryTimeout);
        if (isListening && recognition) {
            try { recognition.abort(); } catch(e) {}
            isListening = false;
            micBtn.classList.remove("listening");
            micBtn.innerHTML = "🎙️";
        }
        currentIdx = (currentIdx - 1 + sentences.length) % sentences.length;
        loadSentence();
        recognition = createRecognition(); // fresh instance
    }
    
    function nextSentence() {
        if (retryTimeout) clearTimeout(retryTimeout);
        if (isListening && recognition) {
            try { recognition.abort(); } catch(e) {}
            isListening = false;
            micBtn.classList.remove("listening");
            micBtn.innerHTML = "🎙️";
        }
        currentIdx = (currentIdx + 1) % sentences.length;
        loadSentence();
        recognition = createRecognition(); // fresh instance
    }
    
    // Initialize
    recognition = createRecognition();
    loadSentence();
    
    micBtn.addEventListener("click", startListening);
    prevBtn.addEventListener("click", prevSentence);
    nextBtn.addEventListener("click", nextSentence);
    
    // Mobile touch fix
    if ('ontouchstart' in window) {
        micBtn.addEventListener("touchstart", (e) => {
            e.preventDefault();
            startListening();
        });
    }
    
    // Fallback for browsers that need user interaction first
    document.body.addEventListener('click', function initMicrophone() {
        // This helps activate audio context on some browsers
        if (recognition) {
            // Just a dummy action to warm up
            document.body.removeEventListener('click', initMicrophone);
        }
    }, { once: true });
</script>
</body>
</html>
