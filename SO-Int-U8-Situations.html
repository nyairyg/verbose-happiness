<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Conversation Practice</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F1B3A;
  --ink-soft:#6B6689;
  --purple:#6C4DF6;
  --purple-dark:#4A2FD0;
  --pink:#FF6FA5;
  --teal:#2EC4B6;
  --yellow:#FFC93C;
  --coral:#FF6B6B;
  --cream:#FFF7EF;
  --card:#FFFFFF;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{min-height:100%;}

body{
  font-family:'Poppins','Segoe UI',system-ui,sans-serif;
  color:var(--ink);
  background:var(--cream);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:28px 16px;
  position:relative;
  overflow-x:hidden;
}

.hidden{display:none !important;}

/* ------- Corporate Memphis background shapes ------- */
.decor{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:0;
  overflow:hidden;
}
.decor .shape{position:absolute;display:block;}
.s1{width:320px;height:320px;border-radius:50%;background:#FFE2EE;top:-130px;left:-120px;}
.s2{width:260px;height:260px;border-radius:50%;background:#DDE9FF;bottom:-110px;right:-90px;}
.s3{width:110px;height:110px;border-radius:50%;background:#D3F3EC;top:12%;right:7%;}
.s4{width:74px;height:74px;border-radius:22px;background:#FFEFC2;transform:rotate(18deg);bottom:14%;left:5%;}
.s5{width:54px;height:54px;border-radius:50%;background:#E3DBFF;top:68%;left:11%;}
.squiggle{
  width:190px;height:60px;
  top:9%;left:6%;
  transform:rotate(-10deg);
  opacity:.85;
}
@media (max-width:820px){
  .s3,.s4,.s5,.squiggle{display:none;}
}

/* ------- Layout ------- */
.wrapper{
  position:relative;
  z-index:1;
  width:100%;
  max-width:720px;
  display:flex;
  flex-direction:column;
  gap:18px;
  text-align:left;
}

.head{
  display:flex;
  align-items:center;
  gap:16px;
}

.avatars{display:flex;flex-shrink:0;}
.ava{
  width:46px;height:46px;
  border-radius:50%;
  display:grid;place-items:center;
  font-weight:700;font-size:17px;color:#fff;
  border:3px solid var(--cream);
}
.ava + .ava{margin-left:-14px;}
.ava.a{background:var(--purple);}
.ava.b{background:var(--pink);}

h1{
  font-size:24px;
  font-weight:700;
  letter-spacing:-.015em;
  line-height:1.2;
  color:var(--ink);
  text-align:left;
}
.sub{
  font-size:13.5px;
  font-weight:500;
  color:var(--ink-soft);
  margin-top:3px;
}

/* ------- Main menu ------- */
.menu-list{
  display:flex;
  flex-direction:column;
  gap:14px;
}

.menu-card{
  display:flex;
  align-items:center;
  gap:16px;
  width:100%;
  background:var(--card);
  border:3px solid transparent;
  border-radius:24px;
  padding:16px 20px;
  cursor:pointer;
  font-family:inherit;
  color:var(--ink);
  text-align:left;
  box-shadow:0 20px 40px -30px rgba(31,27,58,.6),
             0 4px 14px -10px rgba(31,27,58,.15);
  transition:transform .15s ease, box-shadow .15s ease, border-color .15s ease;
}
@media (hover:hover){
  .menu-card:hover{
    transform:translateY(-3px);
    border-color:#E3DBFF;
    box-shadow:0 26px 46px -28px rgba(31,27,58,.7),
               0 6px 18px -10px rgba(31,27,58,.18);
  }
}
.menu-card:active{transform:translateY(0);}
.menu-card .ava{border-color:#fff;}

.menu-info{flex:1;min-width:0;}
.menu-title{
  font-size:16.5px;
  font-weight:700;
  letter-spacing:-.01em;
  line-height:1.25;
}
.menu-sub{
  font-size:12.5px;
  font-weight:500;
  color:var(--ink-soft);
  margin-top:3px;
}

.menu-badge{
  flex-shrink:0;
  font-size:11px;
  font-weight:700;
  letter-spacing:.07em;
  text-transform:uppercase;
  padding:7px 14px;
  border-radius:999px;
  white-space:nowrap;
  background:#F1EDFB;
  color:var(--ink-soft);
}
.menu-badge.progress{background:#FFF3D1;color:#8A6100;}
.menu-badge.done{background:#D3F3EC;color:#0E7F73;}

.menu-foot{
  display:flex;
  justify-content:center;
  padding-top:2px;
}
.link-btn{
  font-family:inherit;
  font-size:13px;
  font-weight:600;
  color:var(--ink-soft);
  background:transparent;
  border:none;
  cursor:pointer;
  padding:6px 2px;
  text-decoration:underline;
  text-underline-offset:3px;
}
.link-btn:hover{color:var(--ink);}

/* ------- Task top bar ------- */
.task-top{display:flex;}
.back-btn{
  font-family:inherit;
  font-size:13.5px;
  font-weight:600;
  color:var(--ink-soft);
  background:rgba(255,255,255,.75);
  border:2px solid #E5DFF5;
  border-radius:999px;
  padding:8px 18px;
  cursor:pointer;
  transition:background .15s, color .15s, border-color .15s;
}
.back-btn:hover{background:#fff;color:var(--ink);border-color:#D6CBFA;}

/* ------- Chat card ------- */
#chat{
  width:100%;
  background:var(--card);
  border-radius:28px;
  padding:22px;
  min-height:250px;
  max-height:52vh;
  display:flex;
  flex-direction:column;
  gap:14px;
  overflow-y:auto;
  box-shadow:0 26px 50px -34px rgba(31,27,58,.65),
             0 6px 16px -10px rgba(31,27,58,.12);
  scrollbar-width:thin;
  scrollbar-color:#DCD5F5 transparent;
}
#chat::-webkit-scrollbar{width:8px;}
#chat::-webkit-scrollbar-thumb{background:#E2DCF7;border-radius:99px;}

/* ------- Pills (speaker labels) ------- */
.label{
  align-self:flex-start;
  width:fit-content;
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.09em;
  text-transform:uppercase;
  color:#fff;
  background:var(--purple);
  padding:6px 16px;
  border-radius:999px;
  text-align:left;
}

#rows{
  display:flex;
  flex-direction:column;
  gap:14px;
  width:100%;
}

.sentence-row{
  display:flex;
  flex-direction:column;
  gap:6px;
  width:100%;
}

.word-container{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  width:100%;
  min-height:44px;
}

/* ------- Word chips ------- */
.word{
  padding:9px 18px;
  border-radius:999px;
  background:var(--ink-soft);
  color:#fff;
  font-size:15px;
  font-weight:600;
  cursor:grab;
  user-select:none;
  position:relative;
  z-index:1;
  touch-action:none;
  box-shadow:0 3px 0 rgba(31,27,58,.10);
  transition:transform .18s ease, box-shadow .18s ease, background-color .18s ease;
}

@media (hover:hover){
  .word:hover{
    transform:translateY(-2px);
    box-shadow:0 5px 0 rgba(31,27,58,.10);
  }
}

/* The word being dragged is moved offscreen via inline styles.
   This class is a fallback to make sure it's never visible. */
.word.dragging{
  opacity:0;
}

/* Grey muted placeholder slot that shows where the word will drop */
.word-placeholder{
  border-radius:999px;
  background:#EBE7F3;
  box-shadow:inset 0 0 0 2px #D6D0E6;
  flex-shrink:0;
  pointer-events:none;
  transition:width .12s ease, height .12s ease;
}

/* check feedback */
.word-container .word.correct{
  background:#C9F2E9;
  color:var(--ink);
  box-shadow:0 0 0 3px var(--teal), 0 4px 0 rgba(31,27,58,.10);
}
.word-container .word.wrong{
  background:#FFDCDC;
  color:var(--ink);
  box-shadow:0 0 0 3px var(--coral), 0 4px 0 rgba(31,27,58,.10);
}

/* ------- Reply block ------- */
.reply-block{
  display:flex;
  flex-direction:column;
  gap:8px;
  margin-top:6px;
  width:100%;
  animation:popIn .32s cubic-bezier(.2,.9,.3,1.3);
}
.reply-block .label{
  align-self:flex-end;
  background:var(--pink);
}

.student-bubble{
  align-self:flex-end;
  background:var(--purple);
  color:#fff;
  padding:14px 20px;
  border-radius:22px 22px 6px 22px;
  max-width:82%;
  font-size:15px;
  font-weight:600;
  line-height:1.55;
  text-align:left;
  white-space:pre-wrap;
  box-shadow:0 14px 26px -16px rgba(108,77,246,.95);
}

@keyframes popIn{
  from{opacity:0;transform:translateY(10px) scale(.97);}
  to{opacity:1;transform:none;}
}

/* ------- Footer / button ------- */
.footer{
  display:flex;
  align-items:center;
  gap:16px;
  flex-wrap:wrap;
}

.btn{
  font-family:inherit;
  padding:14px 34px;
  font-size:16px;
  font-weight:700;
  color:#fff;
  background:var(--purple);
  border:none;
  border-radius:999px;
  cursor:pointer;
  box-shadow:0 6px 0 var(--purple-dark);
  transition:background-color .2s, transform .12s, box-shadow .12s;
}
.btn:hover{background:#7C60FF;}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--purple-dark);}
.btn:disabled{opacity:.5;cursor:default;transform:none;}

.result{
  font-size:14.5px;
  font-weight:600;
  min-height:22px;
  text-align:left;
}
.result.ok{color:#0E9F8E;}
.result.bad{color:#E0457B;}

@media (max-width:520px){
  h1{font-size:20px;}
  .sub{display:none;}
  .ava{width:40px;height:40px;font-size:15px;}
  #chat{padding:16px;border-radius:24px;max-height:56vh;}
  .btn{width:100%;}
  .footer{gap:10px;}
  .menu-card{padding:14px 16px;gap:12px;}
  .menu-title{font-size:15px;}
  .menu-badge{font-size:10px;padding:6px 11px;}
}
</style>
</head>
<body>

<div class="decor" aria-hidden="true">
  <span class="shape s1"></span>
  <span class="shape s2"></span>
  <span class="shape s3"></span>
  <span class="shape s4"></span>
  <span class="shape s5"></span>
  <svg class="shape squiggle" viewBox="0 0 200 60" fill="none" preserveAspectRatio="none">
    <path d="M6 42C26 6 46 6 66 42s40 36 60 0 40-36 60 0"
          stroke="#FFC93C" stroke-width="9" stroke-linecap="round"/>
  </svg>
</div>

<!-- ===================== MAIN MENU ===================== -->
<div id="menuScreen" class="wrapper">

  <header class="head">
    <div>
      <h1>Conversation Practice</h1>
      <p class="sub">Choose a situation, put the words in order, then say the reply out loud.</p>
    </div>
  </header>

  <div id="menuList" class="menu-list"></div>

  <div class="menu-foot">
    <button class="link-btn" onclick="resetAll()">Reset all progress</button>
  </div>

</div>

<!-- ===================== TASK ===================== -->
<div id="taskScreen" class="wrapper hidden">

  <div class="task-top">
    <button class="back-btn" onclick="goBack()">← Back to menu</button>
  </div>

  <header class="head">
    <div class="avatars" id="taskAvatars"></div>
    <div>
      <h1 id="taskTitle"></h1>
      <p class="sub" id="taskSub"></p>
    </div>
  </header>

  <div id="chat">
    <div class="label" id="sentenceText"></div>
    <div id="rows"></div>
    <!-- Reply block is appended here after a correct answer -->
  </div>

  <div class="footer">
    <button id="actionBtn" class="btn" onclick="handleAction()">Check Answer</button>
    <div id="result" class="result"></div>
  </div>

</div>

<script>
/* =========================================================
   CONFIG — the three situations
   ========================================================= */
const SITUATIONS = {
  s1: {
    id: 's1',
    order: 1,
    title: 'Mary and Jane',
    sub: "Put Mary's words in order, then say Jane's reply out loud.",
    a: { name: 'Mary', initial: 'M' },
    b: { name: 'Jane', initial: 'J' },
    prompts: [
      {
        a: ["Hi!", "Is this a bad time?", "I can come back later."],
        b: "at all / fine. / up?"
      },
      {
        a: ["I have a bit of a problem.",
            "My friend from Japan is arriving tomorrow, and I'm not sure how to act.",
            "What should I do in this situation?"],
        b: "if / were you, prepare / tea / take off / shoes / case."
      },
      {
        a: ["Is it OK if I just hug her when she arrives?"],
        b: "better not. considered rude / some cultures / too touchy / right away. / maybe bow / shake."
      },
      {
        a: ["Got it.", "Do I need to cook a big traditional meal?"],
        b: "not necessary. / rest flight."
      }
    ]
  },

  s2: {
    id: 's2',
    order: 2,
    title: 'Jackie and Mrs. Smith',
    sub: "Put Jackie's words in order, then say Mrs. Smith's reply out loud.",
    a: { name: 'Jackie', initial: 'J' },
    b: { name: 'Mrs. Smith', initial: 'S' },
    prompts: [
      {
        a: ["Excuse me, Mrs. Smith.", "Can I ask you about something?"],
        b: "course. / ahead."
      },
      {
        a: ["It's about the living arrangements.",
            "I'm feeling a bit uncomfortable.",
            "Did I do something wrong?",
            "You guys seem quiet around me lately."],
        b: "of course not.  busy / work. / matter?"
      },
      {
        a: ["Well, I asked for a non-smoking house, but there is smoke inside.",
            "Also, there is never any hot water for my shower."],
        b: "apologies. / not realise / heating / acting up. / sorry / smoking / bothering. / sort / out. / smoke outside / from now on."
      }
    ]
  },

  s3: {
    id: 's3',
    order: 3,
    title: 'Stan and Mark',
    sub: "Put Stan's words in order, then say Mark's reply out loud.",
    a: { name: 'Stan', initial: 'S' },
    b: { name: 'Mark', initial: 'M' },
    prompts: [
      {
        a: ["Hey Mark.", "I have a bit of a problem."],
        b: "really? / matter?"
      },
      {
        a: ["It's about this food.",
            "The boss just gave me this huge steak, but you know I'm a vegetarian.",
            "What should I do in this situation?"],
        b: "oh / were you, / tell / politely."
      },
      {
        a: ["Is it OK if I just pretend to eat it and hide it in a napkin?"],
        b: "better not. / considered rude / catches. / say sorry / no veggie option / not eat meat."
      },
      {
        a: ["Okay, I'll try that.", "Thanks!"],
        b: "happy / help."
      }
    ]
  }
};

/* =========================================================
   SAVED STATE (localStorage)
   Per situation: { round, solved, completed, arrangement }
   arrangement = { round: n, rows: [[token, token, ...], ...] }
   ========================================================= */
const STORAGE_KEY = 'conversation_practice_v1';

function blankState(){
  return { round: 0, solved: false, completed: false, arrangement: null };
}
function defaultState(){
  return { s1: blankState(), s2: blankState(), s3: blankState() };
}

function loadState(){
  const d = defaultState();
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return d;
    const saved = JSON.parse(raw);
    Object.keys(d).forEach(k => {
      const s = saved && saved[k];
      if (s && typeof s === 'object') {
        d[k].round       = Number.isInteger(s.round) ? s.round : 0;
        d[k].solved      = !!s.solved;
        d[k].completed   = !!s.completed;
        d[k].arrangement = (s.arrangement && typeof s.arrangement === 'object')
                            ? s.arrangement : null;
      }
    });
  } catch (e) { /* storage unavailable — start fresh */ }
  return d;
}

function saveState(){
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (e) {}
}

let state = loadState();
let current = null;      // currently open situation id
let isDoneView = false;  // "all prompts completed" screen shown

/* =========================================================
   DOM refs
   ========================================================= */
const menuScreen  = document.getElementById('menuScreen');
const taskScreen  = document.getElementById('taskScreen');
const menuList    = document.getElementById('menuList');
const taskAvatars = document.getElementById('taskAvatars');
const taskTitle   = document.getElementById('taskTitle');
const taskSub     = document.getElementById('taskSub');
const sentenceText= document.getElementById('sentenceText');
const rows        = document.getElementById('rows');
const chat        = document.getElementById('chat');
const resultDiv   = document.getElementById('result');
const actionBtn   = document.getElementById('actionBtn');

/* =========================================================
   MENU
   ========================================================= */
function getStatus(id){
  const st  = state[id];
  const sit = SITUATIONS[id];
  if (st.completed || st.round >= sit.prompts.length) return { cls: 'done', text: '✓ Done' };
  if (st.round > 0 || st.solved)                     return { cls: 'progress', text: 'In progress' };
  return { cls: '', text: 'Start' };
}

function renderMenu(){
  menuList.innerHTML = '';
  Object.values(SITUATIONS).forEach(sit => {
    const status = getStatus(sit.id);

    const card = document.createElement('button');
    card.type = 'button';
    card.className = 'menu-card';
    card.innerHTML =
      '<div class="avatars">' +
        '<span class="ava a">' + sit.a.initial + '</span>' +
        '<span class="ava b">' + sit.b.initial + '</span>' +
      '</div>' +
            '<div class="menu-info">' +
        '<div class="menu-title">Situation ' + sit.order + ': ' + sit.title + '</div>' +
      '</div>' +
      '<span class="menu-badge ' + status.cls + '">' + status.text + '</span>';

    card.addEventListener('click', () => openSituation(sit.id));
    menuList.appendChild(card);
  });
}

function showMenu(){
  current = null;
  isDoneView = false;
  taskScreen.classList.add('hidden');
  menuScreen.classList.remove('hidden');
  renderMenu();
}

function goBack(){
  showMenu();
}

function resetAll(){
  if (!confirm('Reset all saved progress?')) return;
  state = defaultState();
  saveState();
  renderMenu();
}

/* =========================================================
   OPEN A SITUATION
   ========================================================= */
function openSituation(id){
  current = id;
  isDoneView = false;

  const sit = SITUATIONS[id];
  taskAvatars.innerHTML =
    '<span class="ava a">' + sit.a.initial + '</span>' +
    '<span class="ava b">' + sit.b.initial + '</span>';
  taskTitle.textContent = 'Conversation: ' + sit.title;
  taskSub.textContent   = sit.sub;

  menuScreen.classList.add('hidden');
  taskScreen.classList.remove('hidden');

  renderRound();
}

/* =========================================================
   RENDER THE CURRENT ROUND
   ========================================================= */
function renderRound(){
  const sit = SITUATIONS[current];
  const st  = state[current];

  /* ---- reset UI ---- */
  chat.querySelectorAll('.reply-block').forEach(b => b.remove());
  rows.innerHTML = '';
  resultDiv.textContent = '';
  resultDiv.className = 'result';
  actionBtn.disabled = false;
  actionBtn.style.display = '';
  actionBtn.textContent = 'Check Answer';
  isDoneView = false;

  /* ---- all rounds finished? ---- */
  if (st.completed || st.round >= sit.prompts.length) {
    st.completed = true;
    st.solved = false;
    saveState();

    isDoneView = true;
    sentenceText.textContent = 'All prompts completed! 🎉';
    resultDiv.textContent = 'Great job! You finished this situation.';
    resultDiv.className = 'result ok';
    actionBtn.textContent = 'Go back';
    return;
  }

  /* ---- build the round ---- */
  const item = sit.prompts[st.round];
  sentenceText.textContent = sit.a.name + ' says:';

  const savedRows = (st.arrangement && st.arrangement.round === st.round)
                      ? st.arrangement.rows : null;

  item.a.forEach((sentence, si) => {
    const row = document.createElement('div');
    row.className = 'sentence-row';

    const container = document.createElement('div');
    container.className = 'word-container';

    const correctWords = sentence.trim().split(/\s+/);
    container._correctWords = correctWords;

    const tokens = correctWords.map((w, wi) => ({ text: w, token: si + ':' + wi }));

    /* Restore the saved order for this round, or shuffle */
    let ordered = null;
    if (savedRows && Array.isArray(savedRows[si]) && savedRows[si].length === tokens.length) {
      const byToken = new Map(tokens.map(t => [t.token, t]));
      const rebuilt = savedRows[si].map(tok => byToken.get(tok)).filter(Boolean);
      if (rebuilt.length === tokens.length) ordered = rebuilt;
    }
    if (!ordered) ordered = shuffle([...tokens]);

    ordered.forEach(t => {
      const div = document.createElement('div');
      div.textContent = t.text;
      div.className = 'word';
      div.draggable = true;
      div.dataset.token = t.token;
      container.appendChild(div);
    });

    row.appendChild(container);
    rows.appendChild(row);

    addDragEvents(container);
  });

  /* ---- round already solved before leaving? restore that view ---- */
  if (st.solved) {
    lockWords();
    rows.querySelectorAll('.word').forEach(w => w.classList.add('correct'));
    showReplyBlock();
    resultDiv.textContent = "Correct! 🎉 Now say " + sit.b.name + "'s reply aloud.";
    resultDiv.className = 'result ok';
    actionBtn.textContent = 'Next';
  }
}

/* =========================================================
   REPLY BUBBLE
   ========================================================= */
function showReplyBlock(){
  const sit = SITUATIONS[current];
  const st  = state[current];
  const item = sit.prompts[st.round];
  if (!item || !item.b) return;

  const block = document.createElement('div');
  block.className = 'reply-block';

  const label = document.createElement('div');
  label.className = 'label';
  label.textContent = sit.b.name + ':';

  const bubble = document.createElement('div');
  bubble.className = 'student-bubble';
  bubble.textContent = item.b;

  block.appendChild(label);
  block.appendChild(bubble);
  chat.appendChild(block);
  chat.scrollTop = chat.scrollHeight;
}

/* =========================================================
   DRAG ENGINE
   ========================================================= */
let dragged = null;
let activeContainer = null;
let placeholder = null;
let dragGhost = null;
let isTouchDragging = false;
let touchDragOffsetX = 0;
let touchDragOffsetY = 0;

function shuffle(array){
  for (let i = array.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [array[i], array[j]] = [array[j], array[i]];
  }
  return array;
}

function isSolved(){
  return current ? !!state[current].solved : false;
}

function addDragEvents(container){
  container.querySelectorAll('.word').forEach(word => {
    word.addEventListener('dragstart', handleDragStart);
    word.addEventListener('dragend', handleDragEnd);
    word.addEventListener('touchstart', handleTouchStart);
    word.addEventListener('touchmove', handleTouchMove);
    word.addEventListener('touchend', handleTouchEnd);
    word.addEventListener('contextmenu', e => e.preventDefault());
  });

  container.addEventListener('dragover', handleDragOver);
  container.addEventListener('touchmove', handleContainerTouchMove, { passive: false });
  container.addEventListener('touchend', handleContainerTouchEnd);
}

/* ---------- DESKTOP (native HTML5 drag) ---------- */

function handleDragStart(e){
  if (isSolved()) return;
  const word = e.target;
  const rect = word.getBoundingClientRect();

  dragged = word;
  activeContainer = word.parentElement;
  resetFeedback();

  // Offscreen clone used as the drag image
  const ghost = word.cloneNode(true);
  ghost.classList.remove('dragging', 'correct', 'wrong');
  ghost.style.cssText = [
    'position:fixed',
    'left:-9999px',
    'top:-9999px',
    'width:' + rect.width + 'px',
    'height:' + rect.height + 'px',
    'margin:0',
    'box-sizing:border-box',
    'pointer-events:none',
    'opacity:1',
    'transform:none',
    'box-shadow:0 10px 18px -6px rgba(31,27,58,.45)'
  ].join(';');
  document.body.appendChild(ghost);
  dragGhost = ghost;

  try {
    e.dataTransfer.setDragImage(ghost, rect.width / 2, rect.height / 2);
  } catch (err) { /* ignore */ }
  e.dataTransfer.setData('text/plain', '');
  e.dataTransfer.effectAllowed = 'move';

  // Grey placeholder slot
  placeholder = document.createElement('div');
  placeholder.className = 'word-placeholder';
  placeholder.style.width  = rect.width + 'px';
  placeholder.style.height = rect.height + 'px';
  word.parentElement.insertBefore(placeholder, word);

  // Hide the original word offscreen
  word.classList.add('dragging');
  word.style.position = 'fixed';
  word.style.left = '-9999px';
  word.style.top  = '-9999px';
  word.style.width = rect.width + 'px';
}

function handleDragOver(e){
  if (isSolved() || !placeholder || !dragged) return;
  e.preventDefault();
  const container = e.currentTarget;

  // Words can't move between different sentences
  if (activeContainer !== container) return;

  const afterElement = getDragAfterElement(container, e.clientX);
  if (afterElement == null) container.appendChild(placeholder);
  else container.insertBefore(placeholder, afterElement);
}

function getDragAfterElement(container, x){
  const draggableElements = [...container.querySelectorAll('.word:not(.dragging)')];

  return draggableElements.reduce((closest, child) => {
    const box = child.getBoundingClientRect();
    const offset = x - box.left - box.width / 2;
    if (offset < 0 && offset > closest.offset) {
      return { offset: offset, element: child };
    }
    return closest;
  }, { offset: Number.NEGATIVE_INFINITY }).element;
}

function handleDragEnd(){
  if (!dragged) return;

  if (placeholder && placeholder.parentElement) {
    placeholder.parentElement.insertBefore(dragged, placeholder);
    placeholder.remove();
  } else if (activeContainer) {
    activeContainer.appendChild(dragged);
  }
  placeholder = null;

  dragged.classList.remove('dragging');
  dragged.style.position = '';
  dragged.style.left = '';
  dragged.style.top = '';
  dragged.style.width = '';

  if (dragGhost) { dragGhost.remove(); dragGhost = null; }

  dragged = null;
  activeContainer = null;

  saveArrangement();
}

/* ---------- TOUCH (custom finger-following drag) ---------- */

function handleTouchStart(e){
  if (isSolved()) return;
  e.preventDefault();
  const touch = e.touches[0];
  dragged = e.target;
  activeContainer = dragged.parentElement;
  isTouchDragging = true;

  const rect = dragged.getBoundingClientRect();
  touchDragOffsetX = touch.clientX - rect.left;
  touchDragOffsetY = touch.clientY - rect.top;

  dragged.classList.add('dragging');
  resetFeedback();

  dragged.style.position = 'fixed';
  dragged.style.left = rect.left + 'px';
  dragged.style.top  = rect.top + 'px';
  dragged.style.width = rect.width + 'px';
  dragged.style.zIndex = '1000';
  dragged.style.transform = 'scale(1.05)';
  dragged.style.opacity = '1';
}

function handleTouchMove(e){
  if (!isTouchDragging || !dragged) return;
  e.preventDefault();
  const touch = e.touches[0];
  dragged.style.left = (touch.clientX - touchDragOffsetX) + 'px';
  dragged.style.top  = (touch.clientY - touchDragOffsetY) + 'px';
}

function handleTouchEnd(e){
  if (!isTouchDragging || !dragged) return;
  isTouchDragging = false;

  dragged.classList.remove('dragging');
  dragged.style.position = '';
  dragged.style.left = '';
  dragged.style.top = '';
  dragged.style.width = '';
  dragged.style.zIndex = '';
  dragged.style.transform = '';
  dragged.style.opacity = '';

  const touch = e.changedTouches[0];
  const container = activeContainer;

  if (container) {
    const elements = [...container.querySelectorAll('.word')];
    const droppedIndex = getTouchDropIndex(touch.clientX, touch.clientY, elements);

    if (droppedIndex !== -1 && dragged !== elements[droppedIndex]) {
      if (droppedIndex === elements.length - 1) container.appendChild(dragged);
      else container.insertBefore(dragged, elements[droppedIndex]);
    }
  }

  dragged = null;
  activeContainer = null;

  saveArrangement();
}

function handleContainerTouchMove(e){
  if (isTouchDragging) e.preventDefault();
}

function handleContainerTouchEnd(){}

function getTouchDropIndex(x, y, elements){
  for (let i = 0; i < elements.length; i++) {
    const rect = elements[i].getBoundingClientRect();
    if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) return i;
  }
  return -1;
}

/* =========================================================
   SAVE / RESTORE WORD ORDER
   ========================================================= */
function saveArrangement(){
  if (!current) return;
  const st = state[current];
  if (st.completed) return;

  const containers = [...rows.querySelectorAll('.word-container')];
  st.arrangement = {
    round: st.round,
    rows: containers.map(c =>
      [...c.children]
        .filter(el => el.classList.contains('word'))
        .map(w => w.dataset.token)
    )
  };
  saveState();
}

/* =========================================================
   FEEDBACK & ACTIONS
   ========================================================= */
function resetFeedback(){
  rows.querySelectorAll('.word').forEach(w => w.classList.remove('correct', 'wrong'));
}

function handleAction(){
  if (isDoneView) { goBack(); return; }

  const st = state[current];
  if (st.solved) { nextRound(); return; }

  checkAnswer();
}

function checkAnswer(){
  const st = state[current];
  const containers = [...rows.querySelectorAll('.word-container')];
  let isAllCorrect = true;

  containers.forEach(container => {
    const wordEls = [...container.children].filter(el => el.classList.contains('word'));
    const words = wordEls.map(w => w.textContent);
    const correctWords = container._correctWords;

    wordEls.forEach((wordDiv, i) => {
      wordDiv.classList.remove('correct', 'wrong');
      if (words[i] === correctWords[i]) {
        wordDiv.classList.add('correct');
      } else {
        wordDiv.classList.add('wrong');
        isAllCorrect = false;
      }
    });
  });

  if (!isAllCorrect) {
    resultDiv.textContent = 'Some words are incorrect. Try again.';
    resultDiv.className = 'result bad';
    return;
  }

  /* ---- correct ---- */
  st.solved = true;
  saveState();
  saveArrangement();

  const sit = SITUATIONS[current];
  resultDiv.textContent = "Correct! 🎉 Now say " + sit.b.name + "'s reply aloud.";
  resultDiv.className = 'result ok';

  showReplyBlock();
  actionBtn.textContent = 'Next';
  lockWords();
}

function nextRound(){
  const sit = SITUATIONS[current];
  const st  = state[current];

  st.round++;
  st.solved = false;
  st.arrangement = null;

  if (st.round >= sit.prompts.length) st.completed = true;

  saveState();
  renderRound();
}

function lockWords(){
  rows.querySelectorAll('.word').forEach(w => {
    w.draggable = false;
    w.style.cursor = 'default';
  });
}

/* =========================================================
   START
   ========================================================= */
renderMenu();
</script>
</body>
</html>
