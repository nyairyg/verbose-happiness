      answers: ["offered to", "offered", "promoted"],

    },

    },
    {
      text: "60. A: Their house burned down in a fire. B: Oh no. That's [?].",
      answers: ["a shame", "annoying", "awful"],
      correct: "awful"

  let index = -1;
  let locked = false;

  function shuffle(array) {
    for (let i = array.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [array[i], array[j]] = [array[j], array[i]];
    }
    return array;
  }

  function resetColors(answersDiv) {
    const buttons = answersDiv.querySelectorAll('div');
    buttons.forEach(btn => {
      btn.style.background = "#f4f4f4";
      btn.style.color = "#000";
    });
  }

  function highlightAnswer(answersDiv, answerText, isCorrect) {
    const buttons = answersDiv.querySelectorAll('div');
    buttons.forEach(btn => {
      if (btn.innerText === answerText) {
        if (isCorrect) {
          btn.style.background = "#c8f7c5";
          btn.style.color = "#1a4d1a";
        } else {
          btn.style.background = "#f8d7da";
          btn.style.color = "#721c24";
        }
      }
    });
  }

  function nextCard() {
    index++;
    if (index >= quiz.length) index = 0;

    locked = false;

    document.getElementById("questionText").innerText = quiz[index].text;
    const answersDiv = document.getElementById("answers");
    answersDiv.innerHTML = "";

    const shuffledAnswers = shuffle([...quiz[index].answers]);

    shuffledAnswers.forEach(answer => {
      const div = document.createElement("div");
      div.innerText = answer;
      div.style = `
        margin-top:10px;
        padding:12px 16px;
        border-radius:8px;
        background:#f4f4f4;
        cursor:pointer;
        transition: background 0.2s;
        user-select:none;
      `;
      div.onmouseover = () => {
        if (locked) return;
        div.style.background = "#e0e0e0";
      };
      div.onmouseout = () => {
        if (locked) return;
        div.style.background = "#f4f4f4";
      };

      div.onclick = () => {
        if (locked) return;

        const selectedAnswer = answer;
        const correctAnswer = quiz[index].correct;

        resetColors(answersDiv);

        if (selectedAnswer === correctAnswer) {
          highlightAnswer(answersDiv, selectedAnswer, true);
          locked = true;
          setTimeout(() => {
            nextCard();
          }, 700);
        } else {
          highlightAnswer(answersDiv, selectedAnswer, false);
        }
      };

      answersDiv.appendChild(div);
    });
  }

  nextCard();
</script>

</body>
</html>
